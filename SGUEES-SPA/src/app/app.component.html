<!-- motivo: aviso de los últimos 20 segundos antes de cerrar la sesión por 1 día sin actividad -->
<dx-popup
	[visible]="avisoInactividadVisible"
	[showTitle]="true"
	title="Sesión por inactividad"
	[width]="440"
	[height]="'auto'"
	[dragEnabled]="false"
	[hideOnOutsideClick]="false"
	[showCloseButton]="false"
	[wrapperAttr]="{ class: 'idle-session-popup' }"
>
	<div class="idle-session">
		<p class="idle-session__text">
			La sesión se cerrará por inactividad en
			<strong>{{ segundosInactividad }}</strong>
			segundos.
		</p>
		<p class="idle-session__hint">Mueva el mouse o pulse Continuar para seguir en el sistema.</p>
		<div class="idle-session__actions">
			<dx-button
				text="Continuar"
				type="default"
				stylingMode="contained"
				(onClick)="continuarSesion()"
			></dx-button>
		</div>
	</div>
</dx-popup>

<ng-container *ngIf="isPublicPortal; else appShell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #appShell>
  <ng-container *ngIf="mostrarMarco(); else fueraDeSesion">
    <app-side-nav-outer-toolbar>
      <router-outlet></router-outlet>
    </app-side-nav-outer-toolbar>
  </ng-container>

  <!-- Sin sesión: un solo outlet estable. Login/recuperación a pantalla completa (sin tarjeta 330px). -->
  <ng-template #fueraDeSesion>
    <router-outlet *ngIf="esRutaAccesoPantallaCompleta(); else accesoConTarjeta"></router-outlet>
    <ng-template #accesoConTarjeta>
      <app-unauthenticated-content *ngIf="esRutaAcceso(); else salidaOculta"></app-unauthenticated-content>
      <ng-template #salidaOculta>
        <div class="sguees-salida-sesion"></div>
      </ng-template>
    </ng-template>
  </ng-template>
</ng-template>
