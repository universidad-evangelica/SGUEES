<!-- Browse: solicitudes ACA_PROSPECTO y cuántos documentos tienen marcados. -->
<div class="sguees-mtto-view documentos-solicitud-view">
	<!-- Ribbon: abre el popup de documentos de la solicitud enfocada. -->
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[showRibbon]="true"
		[showExport]="false"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="false"
		[showRefresh]="true"
		[showEstadoToolbar]="false"
		[btn1]="textoBtnMostrarDocumentos"
		[btn1Icon]="'doc'"
		[btn1Type]="'default'"
		[btn1Mode]="'contained'"
		[btn1Width]="220"
		(btn1Click)="onMostrarDocumentos()"
		(consultar)="consultar()"
	>
	</app-barra-data-mtto>

	<!-- Grilla de solicitudes. -->
	<app-data-grid-mtto
		#dataGrid
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[repaintChangesOnly]="false"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[showEstadoToolbar]="false"
		[focusedRowKey]="gridFocusedRowKey"
		[permitePrint]="false"
		[permiteEditar]="false"
		[permiteDele]="false"
		[responsiveColumnHiding]="false"
		[columnHidingEnabled]="false"
		[showGrouping]="true"
		[exportFileName]="'DocumentosPorSolicitud'"
		(focusedRowChanged)="focusedRowChanged($event)"
	>
	</app-data-grid-mtto>
</div>

<!-- Popup: catálogo de documentos con check en los que ya se muestran. -->
<dx-popup
	#popupDocumentos
	[(visible)]="popupVisible"
	[showTitle]="true"
	[title]="popupTitulo"
	[width]="820"
	[maxWidth]="'calc(100vw - 24px)'"
	[height]="'auto'"
	[maxHeight]="'calc(100vh - 48px)'"
	[showCloseButton]="true"
	[dragEnabled]="false"
	[wrapperAttr]="{ class: 'documentos-solicitud-popup' }"
	(onHiding)="cerrarPopup()"
>
	<!-- Todos, Ninguno y Guardar solo con permiso de modificar. -->
	<div class="documentos-solicitud-popup-toolbar" *ngIf="permiteEdit">
		<dx-button
			icon="check"
			text="Todos"
			type="success"
			stylingMode="contained"
			(onClick)="selectTodos()"
			[disabled]="guardando || !documentosModal.length"
		></dx-button>
		<dx-button
			icon="close"
			text="Ninguno"
			type="danger"
			stylingMode="contained"
			(onClick)="selectNinguno()"
			[disabled]="guardando || !documentosModal.length"
		></dx-button>
		<dx-button
			icon="save"
			text="Guardar"
			type="default"
			stylingMode="contained"
			(onClick)="guardarDocumentos()"
			[disabled]="guardando || !documentosModal.length"
		></dx-button>
	</div>

	<!-- El check marcado es un documento que ya se muestra en esa solicitud. -->
	<dx-data-grid
		#gridDocumentos
		class="theme-dependent sguees-data-grid-mtto documentos-solicitud-popup-grid"
		[dataSource]="documentosModal"
		keyExpr="CORR_DOCUMENTO_ADMISION"
		[columnAutoWidth]="false"
		[showBorders]="true"
		[showColumnLines]="true"
		[showRowLines]="true"
		[rowAlternationEnabled]="true"
		[hoverStateEnabled]="true"
		[allowColumnResizing]="true"
		[columnResizingMode]="'widget'"
		[width]="'100%'"
		[height]="alturaDocumentosModal"
		[repaintChangesOnly]="false"
		[wordWrapEnabled]="true"
		(onOptionChanged)="onDocumentosModalOptionChanged($event)"
	>
		<dxo-paging [enabled]="true" [pageSize]="documentoModalPageSize"></dxo-paging>
		<dxo-pager
			[visible]="true"
			[showPageSizeSelector]="true"
			[allowedPageSizes]="[5, 10, 25, 50]"
			[showInfo]="true"
		></dxo-pager>
		<dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
		<dxo-header-filter [visible]="true"></dxo-header-filter>
		<dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
		<dxo-load-panel [enabled]="false"></dxo-load-panel>
		<dxo-editing
			[mode]="'cell'"
			[allowUpdating]="permiteEdit"
			[allowAdding]="false"
			[allowDeleting]="false"
			[useIcons]="false"
		></dxo-editing>
		<dxi-column
			dataField="SELECCION"
			caption=""
			[width]="70"
			dataType="boolean"
			[allowSorting]="false"
			[allowFiltering]="false"
			[allowHeaderFiltering]="false"
			[allowEditing]="permiteEdit"
			alignment="center"
		></dxi-column>
		<dxi-column
			dataField="CODIGO"
			caption="Código"
			[width]="110"
			[allowEditing]="false"
		></dxi-column>
		<dxi-column
			dataField="NOMBRE_DOCUMENTO"
			caption="Documento"
			[minWidth]="280"
			[allowEditing]="false"
		></dxi-column>
	</dx-data-grid>
</dx-popup>

<!-- Panel de carga durante consultas y guardados. -->
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
