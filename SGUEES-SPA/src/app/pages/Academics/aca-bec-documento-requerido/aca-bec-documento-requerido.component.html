<div class="sguees-mtto-view">
<app-barra-data-mtto tituloVentana="Documentos requeridos de la beca" [isBrowse]="true" [isForm]="false" [permiteAdd]="false" [showRefresh]="false"></app-barra-data-mtto>

<app-becas-configuracion-tabs activa="documentos" [corrBeca]="becaContexto" [nombreBeca]="nombreBecaContexto" [bloqueado]="!isBrowse()"></app-becas-configuracion-tabs>

<app-barra-data-mtto [ocultarEncabezado]="true"
	[tituloVentana]="'Documentos requeridos de la beca'"
	[showRibbon]="isBrowse()"
	[showExport]="permitePrint"
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[permiteAdd]="permiteAdd && becaContexto > 0 && !loadingVisible"
	[showRefresh]="true"
	[showEstadoToolbar]="true"
	[campoEstado]="mttoCampoEstado"
	[puedeCambiarEstado]="permiteEdit"
	[focusedRow]="isBrowse() ? model : null"
	(consultar)="consultar()"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
	(activarInactivar)="activar_inactivar()"
>
</app-barra-data-mtto>

<div class="content-block dx-card responsive-paddings" *ngIf="isBrowse()">
  <label>Beca</label>
  <dx-select-box [dataSource]="tiposBeca" valueExpr="CORR_BECA" displayExpr="NOMBRE_BECA" [value]="becaContexto"
    [searchEnabled]="true" [disabled]="loadingVisible" [showClearButton]="false" placeholder="Seleccione una beca"
    (onValueChanged)="seleccionarBeca($event.value)"></dx-select-box>
</div>

<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
  <h3>{{ isForm() ? (model?.CORR_BECA_DOCUMENTO_REQUERIDO ? 'Editar documento' : 'Nuevo documento') : 'Consultar documento' }}</h3>
  <p>Beca: {{ nombreBecaContexto }}</p>


	<dx-form
		#fData
		id="fData"
		[formData]="model"
		[labelLocation]="'top'"
		[colCount]="1"
		[colCountByScreen]="{xs:1,sm:1,md:1,lg:1}"
		[showRequiredMark]="false"
		[items]="items"
	>
	</dx-form>
</div>

<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="mttoGridKeyExpr"
	[pageSize]="mttoPageSize"
	[allowedPageSizes]="mttoPageSizes"
	[remoteOperations]="mttoRemoteOperations"
	[repaintChangesOnly]="false"
	[nativeToolbar]="true"
	[unifiedToolbar]="false"
	[showSearch]="false"
	[showAdd]="false"
	[showRefresh]="false"
	[showExport]="false"
	[showEstadoToolbar]="true"
	[campoEstado]="mttoCampoEstado"
	[puedeCambiarEstado]="permiteEdit"
	[focusedRowKey]="gridFocusedRowKey"
	[permitePrint]="permitePrint"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	[responsiveColumnHiding]="false"
	[columnHidingEnabled]="false"
	[exportFileName]="'DocumentosRequeridosBeca'"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="onEditClick($event)"
>
</app-data-grid-mtto>

</div>

<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
