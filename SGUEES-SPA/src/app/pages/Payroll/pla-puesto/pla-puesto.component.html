<!-- Contenedor principal del mantenimiento de puesto. -->
<div class="sguees-mtto-view">
	<!-- Toolbar: nuevo, guardar, cancelar y activar/inactivar. -->
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[showRibbon]="true"
		[showExport]="permitePrint"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="true"
		[showEstadoToolbar]="true"
		[campoEstado]="mttoCampoEstado"
		[puedeCambiarEstado]="permiteEdit"
		[focusedRow]="isBrowse() ? model : null"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
		(activarInactivar)="activar_inactivar()"
	>
	</app-barra-data-mtto>

	<!-- Formulario de creación/edición (oculto en browse). -->
	<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
		<dx-tab-panel [swipeEnabled]="false">
			<!-- motivo: datos del puesto -->
			<dxi-item title="Puesto" [icon]="'card'">
		<dx-form
			#fData
			id="fData"
			[formData]="model"
			[labelLocation]="'top'"
			[colCount]="mttoFormColCount"
			[colCountByScreen]="mttoFormColCountByScreen"
			[showRequiredMark]="false"
			[items]="items"
		>
			<div *dxTemplate="let cellInfo of 'CORR_TIPO_PUESTOLookup'">
				<app-data-lookup
					[model]="mCORR_TIPO_PUESTO"
					[value]="model.CORR_TIPO_PUESTO"
					(valueChange)="onTipoPuestoChanged($event)"
					[valueExpr]="'CORR_TIPO_PUESTO'"
					[displayExpr]="'NOMBRE_TIPO_PUESTO'"
					[selectedRowKeys]="selectedLookUpCORR_TIPO_PUESTO"
					[showClearButton]="true"
					[readOnly]="readOnly"
				></app-data-lookup>
			</div>
		</dx-form>
			</dxi-item>

			<!-- motivo: salarios del puesto según las unidades que lo tienen -->
			<dxi-item title="Salarios" [icon]="'money'">
				<div class="ps-panel">
					<div class="ps-head">
						<h4 class="ps-title">Salarios</h4>
						<dx-button
							text="Agregar"
							icon="plus"
							type="default"
							stylingMode="outlined"
							[disabled]="!tienePuestoGuardado || readOnly"
							(onClick)="abrirSubmodalSalarioNuevo()"
						></dx-button>
					</div>
					<p class="ps-hint" *ngIf="!tienePuestoGuardado">
						Guarde el puesto para poder registrar salarios por unidad.
					</p>
					<div class="ps-cards" *ngIf="salarios?.length; else sinSalarios">
						<article class="ps-card" *ngFor="let s of salarios; let i = index">
							<div class="ps-card__body">
								<div class="ps-card__title">{{ s.NOMBRE_UNIDAD || 'Sin unidad' }}</div>
								<div class="ps-card__summary">{{ resumenSalario(s) }}</div>
							</div>
							<div class="ps-card__actions" *ngIf="!readOnly">
								<dx-button icon="edit" stylingMode="text" hint="Editar" (onClick)="abrirSubmodalSalarioEditar(i)"></dx-button>
								<dx-button icon="trash" stylingMode="text" hint="Quitar" (onClick)="eliminarSalario(i)"></dx-button>
							</div>
						</article>
					</div>
					<ng-template #sinSalarios>
						<p class="ps-empty" *ngIf="tienePuestoGuardado">Sin salarios registrados.</p>
					</ng-template>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</div>

	<!-- Grilla del catálogo con acciones de mantenimiento. -->
	<app-data-grid-mtto
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[repaintChangesOnly]="false"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[showEstadoToolbar]="true"
		[campoEstado]="mttoCampoEstado"
		[puedeCambiarEstado]="permiteEdit"
		[focusedRowKey]="gridFocusedRowKey"
		[permitePrint]="permitePrint"
		[permiteEditar]="getPermiteEditar"
		[permiteDele]="getPermiteDele"
		[responsiveColumnHiding]="false"
		[columnHidingEnabled]="false"
		[exportFileName]="'Puestos'"
		(rowDblClick)="rowDblClick($event)"
		(rowRemoving)="rowRemoving($event)"
		(focusedRowChanged)="focusedRowChanged($event)"
		(editClick)="onEditClick($event)"
	></app-data-grid-mtto>
</div>

	<!-- motivo: alta/edición del salario del puesto en una unidad -->
	<dx-popup
		[(visible)]="submodalSalarioVisible"
		[title]="tituloSubmodalSalario"
		[width]="720"
		[maxWidth]="'94vw'"
		[height]="'auto'"
		[maxHeight]="'90vh'"
		[dragEnabled]="false"
		[showCloseButton]="true"
		[hideOnOutsideClick]="false"
		(onHiding)="cerrarSubmodalSalario()"
	>
		<div *dxTemplate="let data of 'content'" class="ps-submodal">
			<div class="ps-grid">
				<div class="ps-field ps-field--wide">
					<label class="ps-label">Unidad <span class="req">*</span></label>
					<dx-select-box
						stylingMode="outlined"
						[(value)]="submodalSalarioDraft.CORR_UNIDAD"
						[items]="unidadesDisponiblesSalario"
						displayExpr="NOMBRE_UNIDAD"
						valueExpr="CORR_UNIDAD"
						[searchEnabled]="true"
						[showClearButton]="true"
					></dx-select-box>
				</div>
				<div class="ps-field">
					<label class="ps-label">Salario inicial</label>
					<dx-number-box stylingMode="outlined" [(value)]="submodalSalarioDraft.SALARIO_INICIAL" format="#,##0.00" [min]="0" [showClearButton]="true"></dx-number-box>
				</div>
				<div class="ps-field">
					<label class="ps-label">Salario actual</label>
					<dx-number-box stylingMode="outlined" [(value)]="submodalSalarioDraft.SALARIO_ACTUAL" format="#,##0.00" [min]="0" [showClearButton]="true"></dx-number-box>
				</div>
				<div class="ps-field">
					<label class="ps-label">Salario final</label>
					<dx-number-box stylingMode="outlined" [(value)]="submodalSalarioDraft.SALARIO_FINAL" format="#,##0.00" [min]="0" [showClearButton]="true"></dx-number-box>
				</div>
				<div class="ps-field">
					<label class="ps-label">Fecha de ingreso</label>
					<dx-date-box
						stylingMode="outlined"
						type="date"
						displayFormat="dd/MM/yyyy"
						[(value)]="submodalSalarioDraft.FECHA_INGRESO"
						[showClearButton]="false"
					></dx-date-box>
				</div>
			</div>
			<div class="ps-submodal__footer">
				<dx-button text="Cancelar" stylingMode="outlined" type="normal" (onClick)="cerrarSubmodalSalario()"></dx-button>
				<dx-button text="Guardar" type="default" icon="save" (onClick)="guardarSubmodalSalario()"></dx-button>
			</div>
		</div>
	</dx-popup>

<!-- Overlay de carga durante operaciones asíncronas. -->
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
