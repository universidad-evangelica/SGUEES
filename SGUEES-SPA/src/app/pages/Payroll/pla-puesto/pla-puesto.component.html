<!-- Contenedor principal del mantenimiento de puesto. -->
<div class="sguees-mtto-view">
	<!-- Toolbar: nuevo, guardar, cancelar y activar/inactivar. -->
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[showRibbon]="true"
		[showExport]="permitePrint"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="true"
		[showEstadoToolbar]="true"
		[campoEstado]="mttoCampoEstado"
		[puedeCambiarEstado]="permiteEdit"
		[focusedRow]="isBrowse() ? model : null"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
		(activarInactivar)="activar_inactivar()"
	>
	</app-barra-data-mtto>

	<!-- Formulario de creación/edición (oculto en browse). -->
	<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
		<!-- motivo: datos del puesto, siempre visibles arriba -->
		<div class="ps-form">
			<dx-form
				#fData
				id="fData"
				[formData]="model"
				[labelLocation]="'top'"
				[colCount]="mttoFormColCount"
				[colCountByScreen]="mttoFormColCountByScreen"
				[showRequiredMark]="false"
				[items]="items"
			>
				<div *dxTemplate="let cellInfo of 'CORR_TIPO_PUESTOLookup'">
					<app-data-lookup
						[model]="mCORR_TIPO_PUESTO"
						[value]="model.CORR_TIPO_PUESTO"
						(valueChange)="onTipoPuestoChanged($event)"
						[valueExpr]="'CORR_TIPO_PUESTO'"
						[displayExpr]="'NOMBRE_TIPO_PUESTO'"
						[selectedRowKeys]="selectedLookUpCORR_TIPO_PUESTO"
						[showClearButton]="true"
						[readOnly]="readOnly"
					></app-data-lookup>
				</div>
			</dx-form>
		</div>

		<!-- motivo: Unidades asocia el puesto; Salarios lista esas unidades aunque no tengan salario -->
		<dx-tab-panel class="ps-tabs" *ngIf="tienePuestoGuardado" [swipeEnabled]="false">
			<dxi-item title="Unidades" [icon]="'group'">
				<div class="ps-panel">
					<!-- motivo: en lectura no se asignan ni se quitan unidades -->
					<div class="ps-head" *ngIf="!readOnly">
						<dx-button
							text="Asignar"
							icon="check"
							type="default"
							stylingMode="outlined"
							(onClick)="abrirSubmodalUnidad()"
						></dx-button>
					</div>
					<dx-data-grid
						class="theme-dependent sguees-data-grid-mtto ps-salarios-grid"
						[dataSource]="unidadesAsignadas"
						keyExpr="CORR_UNIDAD"
						[columnAutoWidth]="false"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[allowColumnResizing]="true"
						[columnResizingMode]="'widget'"
						[width]="'100%'"
						noDataText="Sin unidades asociadas."
					>
						<dxo-paging [enabled]="true" [pageSize]="5"></dxo-paging>
						<dxo-pager [visible]="true" [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 25]" [showInfo]="true"></dxo-pager>
						<dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
						<dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
						<dxo-load-panel [enabled]="false"></dxo-load-panel>
						<dxi-column caption="" [width]="70" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesUnidadTpl" [visible]="!readOnly" alignment="center"></dxi-column>
						<dxi-column dataField="CODIGO_UNIDAD" caption="Codigo" [width]="140"></dxi-column>
						<dxi-column dataField="NOMBRE_UNIDAD" caption="Unidad" [width]="320" [minWidth]="180"></dxi-column>
						<div *dxTemplate="let cell of 'accionesUnidadTpl'">
							<dx-button icon="trash" stylingMode="text" hint="Quitar" (onClick)="quitarUnidad(cell.data)"></dx-button>
						</div>
					</dx-data-grid>
				</div>
			</dxi-item>
			<dxi-item title="Salarios" [icon]="'money'">
				<div class="ps-panel">
					<!-- motivo: Salarios no muestra Agregar. En lectura tampoco se activa ni se desactiva. -->
					<div class="ps-head" *ngIf="!readOnly && salarioSeleccionado?.CORR_PUESTO_SALARIO > 0">
						<dx-button
							[text]="salarioSeleccionado.ACTIVO_PUESTO_SALARIO ? 'Desactivar' : 'Activar'"
							[icon]="salarioSeleccionado.ACTIVO_PUESTO_SALARIO ? 'close' : 'check'"
							stylingMode="outlined"
							[type]="salarioSeleccionado.ACTIVO_PUESTO_SALARIO ? 'danger' : 'success'"
							(onClick)="activarDesactivarSalarioSeleccionado()"
						></dx-button>
					</div>
					<dx-data-grid
						class="theme-dependent sguees-data-grid-mtto ps-salarios-grid"
						[dataSource]="salarios"
						keyExpr="FILA_KEY"
						[focusedRowEnabled]="true"
						[focusedRowKey]="salarioSeleccionado?.FILA_KEY"
						[columnAutoWidth]="false"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[allowColumnResizing]="true"
						[columnResizingMode]="'widget'"
						[width]="'100%'"
						noDataText="Sin unidades asociadas."
						(onFocusedRowChanged)="onSalarioFocused($event)"
						(onRowPrepared)="onSalarioRowPrepared($event)"
					>
						<dxo-paging [enabled]="true" [pageSize]="5"></dxo-paging>
						<dxo-pager
							[visible]="true"
							[showPageSizeSelector]="true"
							[allowedPageSizes]="[5, 10, 25]"
							[showInfo]="true"
						></dxo-pager>
						<dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
						<dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
						<dxo-load-panel [enabled]="false"></dxo-load-panel>
						<dxi-column caption="" [width]="110" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesSalarioTpl" [visible]="!readOnly" alignment="center"></dxi-column>
						<dxi-column dataField="CODIGO_UNIDAD" caption="Codigo" [width]="130"></dxi-column>
						<dxi-column dataField="NOMBRE_UNIDAD" caption="Unidad" [width]="600" [minWidth]="160"></dxi-column>
						<dxi-column dataField="SALARIO_INICIAL" caption="Salario inicial" [width]="160" format="$#,##0.00" alignment="right"></dxi-column>
						<dxi-column dataField="SALARIO_FINAL" caption="Salario final" [width]="150" format="$#,##0.00" alignment="right"></dxi-column>
						<dxi-column dataField="FECHA_INGRESO" caption="Fecha de ingreso" [width]="190" [calculateCellValue]="textoFechaSalario" [allowFiltering]="true"></dxi-column>
						<dxi-column dataField="FECHA_FINALIZACION" caption="Fecha de finalizacion" [width]="190" [calculateCellValue]="textoFechaFinalizacion" [allowFiltering]="true"></dxi-column>
						<dxi-column caption="Estado" [width]="120" [allowFiltering]="false" [allowSorting]="false" cellTemplate="activoSalarioTpl" alignment="center"></dxi-column>
						<div *dxTemplate="let cell of 'activoSalarioTpl'">
							<span
								*ngIf="cell.data.CORR_PUESTO_SALARIO > 0"
								class="estado-badge"
								[class.estado-badge--activo]="cell.data.ACTIVO_PUESTO_SALARIO"
								[class.estado-badge--inactivo]="!cell.data.ACTIVO_PUESTO_SALARIO"
							>{{ cell.data.ACTIVO_PUESTO_SALARIO ? 'Activo' : 'Inactivo' }}</span>
						</div>
						<div *dxTemplate="let cell of 'accionesSalarioTpl'">
							<dx-button icon="edit" stylingMode="text" hint="Editar" (onClick)="abrirSubmodalSalarioEditar(indiceSalario(cell.data))"></dx-button>
							<dx-button *ngIf="cell.data.CORR_PUESTO_SALARIO > 0" icon="trash" stylingMode="text" hint="Quitar" (onClick)="eliminarSalario(indiceSalario(cell.data))"></dx-button>
						</div>
					</dx-data-grid>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</div>

	<!-- Grilla del catálogo con acciones de mantenimiento. -->
	<app-data-grid-mtto
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[repaintChangesOnly]="false"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[showEstadoToolbar]="true"
		[campoEstado]="mttoCampoEstado"
		[puedeCambiarEstado]="permiteEdit"
		[focusedRowKey]="gridFocusedRowKey"
		[permitePrint]="permitePrint"
		[permiteEditar]="getPermiteEditar"
		[permiteDele]="getPermiteDele"
		[responsiveColumnHiding]="false"
		[columnHidingEnabled]="false"
		[exportFileName]="'Puestos'"
		(rowDblClick)="rowDblClick($event)"
		(rowRemoving)="rowRemoving($event)"
		(focusedRowChanged)="focusedRowChanged($event)"
		(editClick)="onEditClick($event)"
	></app-data-grid-mtto>
</div>

	<!-- motivo: tabla de unidades; el check asigna y quitarlo desasocia la unidad del puesto -->
	<dx-popup
		[(visible)]="submodalUnidadVisible"
		title="Asignar unidad"
		[width]="780"
		[maxWidth]="'calc(100vw - 24px)'"
		[height]="'auto'"
		[maxHeight]="'calc(100vh - 48px)'"
		[dragEnabled]="false"
		[showCloseButton]="true"
		[hideOnOutsideClick]="false"
		[wrapperAttr]="{ class: 'ps-unidad-asignar-popup' }"
		(onHiding)="cerrarSubmodalUnidad()"
	>
		<div class="ps-unidad-popup-toolbar">
			<dx-button
				icon="check"
				text="Todos"
				type="success"
				stylingMode="contained"
				(onClick)="selectTodasUnidades()"
				[disabled]="asignandoUnidades || !unidadesModal.length"
			></dx-button>
			<dx-button
				icon="close"
				text="Ninguno"
				type="danger"
				stylingMode="contained"
				(onClick)="selectNingunaUnidad()"
				[disabled]="asignandoUnidades || !unidadesModal.length"
			></dx-button>
			<dx-button
				icon="save"
				text="Guardar"
				type="default"
				stylingMode="contained"
				(onClick)="guardarUnidadesMarcadas()"
				[disabled]="asignandoUnidades || !unidadesModal.length"
			></dx-button>
		</div>
		<dx-data-grid
			class="theme-dependent sguees-data-grid-mtto ps-unidad-popup-grid"
			[dataSource]="unidadesModal"
			keyExpr="CORR_UNIDAD"
			[columnAutoWidth]="false"
			[showBorders]="true"
			[showColumnLines]="true"
			[showRowLines]="true"
			[rowAlternationEnabled]="true"
			[hoverStateEnabled]="true"
			[allowColumnResizing]="true"
			[columnResizingMode]="'widget'"
			[width]="'100%'"
			[height]="alturaUnidadesModal"
			(onOptionChanged)="onUnidadesModalOptionChanged($event)"
			noDataText="No hay unidades."
		>
			<dxo-paging [enabled]="true" [pageSize]="unidadModalPageSize"></dxo-paging>
			<dxo-pager
				[visible]="true"
				[showPageSizeSelector]="true"
				[allowedPageSizes]="[5, 10, 25, 50]"
				[showInfo]="true"
			></dxo-pager>
			<dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
			<dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
			<dxo-load-panel [enabled]="false"></dxo-load-panel>
			<dxo-editing
				[mode]="'cell'"
				[allowUpdating]="!readOnly && !asignandoUnidades"
				[allowAdding]="false"
				[allowDeleting]="false"
				[useIcons]="false"
			></dxo-editing>
			<dxi-column
				dataField="SELECCION"
				caption=""
				[width]="70"
				dataType="boolean"
				[allowSorting]="false"
				[allowFiltering]="false"
				[allowEditing]="!readOnly && !asignandoUnidades"
				alignment="center"
			></dxi-column>
			<dxi-column dataField="CODIGO_UNIDAD" caption="Codigo" [width]="140" [allowEditing]="false"></dxi-column>
			<dxi-column dataField="NOMBRE_UNIDAD" caption="Unidad" [minWidth]="280" [allowEditing]="false"></dxi-column>
		</dx-data-grid>
	</dx-popup>

	<!-- motivo: alta/edición del salario del puesto en una unidad -->
	<dx-popup
		[(visible)]="submodalSalarioVisible"
		[title]="tituloSubmodalSalario"
		[width]="720"
		[maxWidth]="'94vw'"
		[height]="'auto'"
		[maxHeight]="'90vh'"
		[dragEnabled]="false"
		[showCloseButton]="true"
		[hideOnOutsideClick]="false"
		(onHiding)="cerrarSubmodalSalario()"
	>
		<div *dxTemplate="let data of 'content'" class="ps-submodal">
			<div class="ps-grid">
				<div class="ps-field">
					<label class="ps-label">Salario inicial <span class="req">*</span></label>
					<dx-number-box stylingMode="outlined" [(value)]="submodalSalarioDraft.SALARIO_INICIAL" format="$#,##0.00" [min]="0" [showClearButton]="false"></dx-number-box>
				</div>
				<div class="ps-field">
					<label class="ps-label">Salario final <span class="req">*</span></label>
					<dx-number-box stylingMode="outlined" [(value)]="submodalSalarioDraft.SALARIO_FINAL" format="$#,##0.00" [min]="0" [showClearButton]="false"></dx-number-box>
				</div>
				<div class="ps-field">
					<label class="ps-label">Fecha de ingreso <span class="req">*</span></label>
					<dx-date-box
						stylingMode="outlined"
						type="date"
						displayFormat="dd/MM/yyyy"
						[(value)]="submodalSalarioDraft.FECHA_INGRESO"
						[showClearButton]="false"
					></dx-date-box>
				</div>
			</div>
			<div class="ps-submodal__footer">
				<dx-button text="Cancelar" stylingMode="outlined" type="normal" (onClick)="cerrarSubmodalSalario()"></dx-button>
				<dx-button text="Guardar" type="default" icon="save" (onClick)="guardarSubmodalSalario()"></dx-button>
			</div>
		</div>
	</dx-popup>

<!-- Overlay de carga durante operaciones asíncronas. -->
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
