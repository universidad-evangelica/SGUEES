<div class="sguees-mtto-view">
<app-barra-data-mtto
	[tituloVentana]="tituloVentana"
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[showRibbon]="true"
	[permiteAdd]="permiteAdd"
	[showRefresh]="true"
	[showExport]="permitePrint"
	[showDates]="true"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
	(consultar)="consultar()"
	[(FECHA_INICIAL)]="vFECHA_INICIAL"
	[(FECHA_FINAL)]="vFECHA_FINAL"
	[btn1]="btnEnviar"
	[btn1Icon]="'send'"
	[btn1Type]="'success'"
	(btn1Click)="enviarSolicitud()"
	[btn1Width]="140"
	[btn1Mode]="'contained'"
	[btn2]="btnCancelar"
	[btn2Icon]="'undo'"
	[btn2Type]="'default'"
	(btn2Click)="cancelarSolicitud()"
	[btn2Width]="150"
	[btn2Mode]="'contained'"
>
</app-barra-data-mtto>

<div *ngIf="!isBrowse()" class="documento-edit-shell">
	<section class="sguees-section-card documento-form-card">
		<header class="documento-section-head">
			<span class="documento-section-title">Datos de la solicitud</span>
			<span class="documento-section-subtitle">Encabezado de la solicitud de cheque</span>
		</header>
		<dx-form
			#fData
			id="fData"
			class="sguees-form-premium documento-form"
			[formData]="model"
			[labelLocation]="'top'"
			[colCount]="8"
			[items]="items"
			[customizeItem]="customizeItem"
		>
			<div *dxTemplate="let cellInfo of 'MES_PERIODOLookup'">
				<app-data-lookup
					[model]="mMES_PERIODO"
					[(value)]="model.MES_PERIODO"
					[selectedRowKeys]="selectedLookUpLista"
					[readOnly]="readOnly"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'CORR_TIPO_MOVIMIENTOLookup'">
				<app-data-lookup
					[model]="mCORR_TIPO_MOVIMIENTO"
					[(value)]="model.CORR_TIPO_MOVIMIENTO"
					[selectedRowKeys]="selectedLookUpCORR_TIPO_MOVIMIENTO"
					[readOnly]="true"
					[valueExpr]="'CORR_TIPO_MOVIMIENTO'"
					[displayExpr]="'NOMBRE_TIPO_MOVIMIENTO'"
					[lookupColumns]="tipoMoviLookupColumns"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'CORR_CUENTA_BANCOLookup'">
				<app-data-lookup
					[model]="mCORR_CUENTA_BANCO"
					[(value)]="model.CORR_CUENTA_BANCO"
					[selectedRowKeys]="selectedLookUpCORR_CUENTA_BANCO"
					[readOnly]="readOnly"
					[valueExpr]="'CORR_CUENTA_BANCO'"
					[displayExpr]="'NOMBRE_CUENTA_BANCO'"
					[lookupColumns]="cuentaBancoLookupColumns"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'CORR_TIPO_CHEQUELookup'">
				<app-data-lookup
					[model]="mCORR_TIPO_CHEQUE"
					[(value)]="model.CORR_TIPO_CHEQUE"
					[selectedRowKeys]="selectedLookUpCORR_TIPO_CHEQUE"
					[readOnly]="readOnly"
					[valueExpr]="'CORR_TIPO_CHEQUE'"
					[displayExpr]="'NOMBRE_TIPO_CHEQUE'"
					[lookupColumns]="tipoChequeLookupColumns"
					(valueChange)="onTipoChequeChanged($event)"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'ESTADO_DOCUMENTOLookup'">
				<app-data-lookup
					[model]="mESTADO_DOCUMENTO"
					[(value)]="model.ESTADO_DOCUMENTO"
					[selectedRowKeys]="selectedLookUpESTADO_DOCUMENTO"
					[readOnly]="true"
					[valueExpr]="'ESTADO_DOCUMENTO'"
					[displayExpr]="'NOMBRE_ESTADO_DOCUMENTO'"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'CORR_PROVEEDORLookup'">
				<app-data-lookup
					[model]="mCORR_PROVEEDOR"
					[(value)]="model.CORR_PROVEEDOR"
					[selectedRowKeys]="selectedLookUpCORR_PROVEEDOR"
					[readOnly]="readOnly"
					[valueExpr]="'CORR_PROVEEDOR'"
					[displayExpr]="'NOMBRE_PROVEEDOR'"
					[lookupColumns]="proveedorLookupColumns"
					(valueChange)="onProveedorChanged($event)"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'CORR_EMPLEADOLookup'">
				<app-data-lookup
					[model]="mCORR_EMPLEADO"
					[(value)]="model.CORR_EMPLEADO"
					[selectedRowKeys]="selectedLookUpCORR_EMPLEADO"
					[readOnly]="readOnly"
					[valueExpr]="'CORR_EMPLEADO'"
					[displayExpr]="'NOMBRE_EMPLEADO'"
					[lookupColumns]="empleadoLookupColumns"
					(valueChange)="onEmpleadoChanged($event)"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'CORR_CLIENTELookup'">
				<app-data-lookup
					[model]="mCORR_CLIENTE"
					[(value)]="model.CORR_CLIENTE"
					[selectedRowKeys]="selectedLookUpCORR_CLIENTE"
					[readOnly]="readOnly"
					[valueExpr]="'CORR_CLIENTE'"
					[displayExpr]="'NOMBRE_CLIENTE'"
					[lookupColumns]="clienteLookupColumns"
					(valueChange)="onClienteChanged($event)"
				>
				</app-data-lookup>
			</div>
		</dx-form>
	</section>

	<section class="sguees-section-card documento-detalle-card">
		<dx-tab-panel class="documento-tab-panel" [selectedIndex]="0">
			<dxi-item title="Detalle contable" icon="detailslayout">
				<div class="dx-grid-deta documento-deta-grid">
					<div class="documento-deta-toolbar" *ngIf="puedeEditarDetalle()">
						<dx-button
							class="documento-deta-toolbar-btn"
							icon="add"
							text="Agregar Detalle"
							type="success"
							stylingMode="contained"
							(onClick)="agregarDetalle()"
							[disabled]="detalleEditando"
						></dx-button>
						<dx-button
							class="documento-deta-toolbar-btn"
							icon="save"
							text="Guardar"
							type="success"
							stylingMode="contained"
							(onClick)="guardarDetalleEditado()"
							[disabled]="!detalleEditando"
						></dx-button>
						<dx-button
							class="documento-deta-toolbar-btn documento-deta-toolbar-btn--cancel"
							icon="revert"
							text="Cancelar"
							type="danger"
							stylingMode="contained"
							(onClick)="cancelarDetalleEditado()"
							[disabled]="!detalleEditando"
						></dx-button>
					</div>
					<dx-data-grid
						#gridDetalle
						class="theme-dependent sguees-data-grid-mtto sguees-data-grid-mtto--enterprise documento-deta-datagrid"
						[dataSource]="detalles"
						keyExpr="CORR_DOCUMENTO_DETA"
						[columnAutoWidth]="false"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[allowColumnResizing]="true"
						[columnResizingMode]="'widget'"
						[focusedRowEnabled]="true"
						[autoNavigateToFocusedRow]="true"
						[height]="'100%'"
						[width]="'100%'"
						(onContentReady)="onDetalleGridContentReady($event)"
						(onRowInserting)="detalleRowInserting($event)"
						(onRowUpdating)="detalleRowUpdating($event)"
						(onRowRemoving)="detalleRowRemoving($event)"
						(onRowValidating)="detalleRowValidating($event)"
						(onInitNewRow)="detalleInitNewRow($event)"
						(onEditingStart)="onDetalleEditingStart($event)"
						(onSaved)="onDetalleSaved($event)"
						(onEditCanceled)="onDetalleEditCanceled($event)"
						(onEditorPreparing)="onDetalleEditorPreparing($event)"
					>
						<dxo-toolbar>
							<dxi-item name="searchPanel" location="after"></dxi-item>
						</dxo-toolbar>
						<dxo-editing
							[mode]="'row'"
							[refreshMode]="'reshape'"
							[allowAdding]="puedeEditarDetalle()"
							[allowUpdating]="puedeEditarDetalle()"
							[allowDeleting]="puedeEditarDetalle()"
							[useIcons]="true"
							[selectTextOnEditStart]="true"
						></dxo-editing>
						<dxo-search-panel [visible]="true"></dxo-search-panel>
						<dxo-paging [enabled]="false"></dxo-paging>
						<dxi-column
							type="buttons"
							name="btnAcciones"
							caption="Options"
							[width]="104"
							[minWidth]="104"
							[fixed]="true"
							fixedPosition="left"
							alignment="center"
							[allowResizing]="false"
						>
							<dxi-button
								hint="Editar registro"
								icon="edit"
								stylingMode="text"
								cssClass="sguees-grid-action-edit"
								[visible]="detalleEditButtonVisible"
								[onClick]="editarDetalleClick"
							></dxi-button>
							<dxi-button
								name="delete"
								hint="Eliminar registro"
								icon="trash"
								stylingMode="text"
								cssClass="sguees-grid-action-delete"
								[visible]="detalleDeleteButtonVisible"
							></dxi-button>
							<dxi-button name="save" [visible]="false"></dxi-button>
							<dxi-button name="cancel" [visible]="false"></dxi-button>
							<dxi-button name="edit" [visible]="false"></dxi-button>
						</dxi-column>
						<dxi-column
							dataField="CUENTA_CONTABLE"
							caption="Cuenta contable"
							[width]="130"
							[minWidth]="115"
							[calculateDisplayValue]="cuentaContableDisplay"
							[setCellValue]="cuentaSetCellValue"
							[editCellTemplate]="'CUENTA_CONTABLELookup'"
						>
							<dxo-lookup
								[dataSource]="mCUENTA_CONTABLE"
								valueExpr="CUENTA_CONTABLE"
								displayExpr="CUENTA_CONTABLE"
							></dxo-lookup>
						</dxi-column>
						<div *dxTemplate="let cellInfo of 'CUENTA_CONTABLELookup'">
							<app-data-lookup
								[setValue]="cellInfo.setValue"
								[model]="mCUENTA_CONTABLE"
								[(value)]="cellInfo.value"
								[selectedRowKeys]="selectedLookUpCUENTA_CONTABLE"
								[readOnly]="readOnly"
								[valueExpr]="'CUENTA_CONTABLE'"
								[displayExpr]="'CUENTA_CONTABLE'"
								[lookupColumns]="cuentaLookupColumns"
							>
							</app-data-lookup>
						</div>
						<dxi-column
							dataField="NOMBRE_CUENTA"
							caption="Nombre cuenta"
							width="16%"
							[allowEditing]="false"
						></dxi-column>
						<dxi-column
							dataField="CORR_CENTRO_COSTO"
							caption="Cod. centro"
							[width]="100"
							[minWidth]="90"
							[calculateDisplayValue]="codigoCentroDisplay"
							[setCellValue]="centroCostoSetCellValue"
							[editCellTemplate]="'CORR_CENTRO_COSTOLookup'"
						>
							<dxo-lookup
								[dataSource]="mCORR_CENTRO_COSTO"
								valueExpr="CORR_CENTRO_COSTO"
								displayExpr="CODIGO_CENTRO_COSTO"
							></dxo-lookup>
						</dxi-column>
						<div *dxTemplate="let cellInfo of 'CORR_CENTRO_COSTOLookup'">
							<app-data-lookup
								[setValue]="cellInfo.setValue"
								[model]="getCentrosPorCuenta(cellInfo.data.CUENTA_CONTABLE)"
								[(value)]="cellInfo.value"
								[selectedRowKeys]="selectedLookUpCORR_CENTRO_COSTO"
								[readOnly]="readOnly || !cellInfo.data.CUENTA_CONTABLE || !tieneCentrosAsignados(cellInfo.data.CUENTA_CONTABLE)"
								[valueExpr]="'CORR_CENTRO_COSTO'"
								[displayExpr]="'CODIGO_CENTRO_COSTO'"
								[lookupColumns]="centroLookupColumns"
							>
							</app-data-lookup>
						</div>
						<dxi-column
							dataField="NOMBRE_CENTRO"
							caption="Centro costo"
							width="17%"
							[allowEditing]="false"
							[calculateDisplayValue]="centroCostoNombreDisplay"
						></dxi-column>
						<dxi-column dataField="NOMBRE_TRAN" caption="Descripción" width="40%"></dxi-column>
						<dxi-column
							dataField="MONTO_CARGO"
							caption="Cargo"
							[width]="120"
							[minWidth]="110"
							alignment="right"
							dataType="number"
							[format]="'#,##0.00'"
							[editorOptions]="{ format: '#,##0.00' }"
						></dxi-column>
						<dxi-column
							dataField="MONTO_ABONO"
							caption="Abono"
							[width]="120"
							[minWidth]="110"
							alignment="right"
							dataType="number"
							[format]="'#,##0.00'"
							[editorOptions]="{ format: '#,##0.00' }"
						></dxi-column>
						<dxo-summary>
							<dxi-total-item
								column="CUENTA_CONTABLE"
								summaryType="count"
								valueFormat="#,##0"
								displayFormat="Cant: {0}"
							></dxi-total-item>
							<dxi-total-item
								column="MONTO_CARGO"
								summaryType="sum"
								valueFormat="#,##0.00"
								displayFormat="{0}"
							></dxi-total-item>
							<dxi-total-item
								column="MONTO_ABONO"
								summaryType="sum"
								valueFormat="#,##0.00"
								displayFormat="{0}"
							></dxi-total-item>
						</dxo-summary>
					</dx-data-grid>
					<div class="documento-deta-footer">
						<span
							class="documento-diferencia-chip"
							[class.is-balanced]="getDiferencia() === 0"
							[class.is-unbalanced]="getDiferencia() !== 0"
						>
							<span class="documento-diferencia-label">Diferencia</span>
							<span class="documento-diferencia-value">{{ getDiferencia() | number:'1.2-2' }}</span>
						</span>
					</div>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</section>
</div>

<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="['ANIO_PERIODO', 'MES_PERIODO', 'CORR_TIPO_MOVIMIENTO', 'CORR_DOCUMENTO']"
	[columnAutoWidth]="false"
	[showSearch]="false"
	[nativeToolbar]="true"
	[unifiedToolbar]="false"
	[showAdd]="false"
	[showRefresh]="false"
	[showExport]="false"
	[showGrouping]="true"
	[permitePrint]="permitePrint"
	[exportFileName]="'Solicitud de Cheques'"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	[responsiveColumnHiding]="false"
	[columnHidingEnabled]="false"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="editarClick($event)"
>
</app-data-grid-mtto>
</div>

<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
