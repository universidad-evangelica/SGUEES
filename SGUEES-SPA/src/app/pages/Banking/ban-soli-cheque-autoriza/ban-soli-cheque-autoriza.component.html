<div class="sguees-mtto-view">
<h2 class="content-block">{{ tituloVentana }}</h2>

<div class="view-wrapper list-page content-block dx-card responsive-paddings filtros-card">
	<div class="filtros">
		<div class="filtro">
			<div class="filtro-label">Fecha Inicial</div>
			<dx-date-box
				class="filtro-control"
				[(value)]="vFECHA_INICIAL"
				[useMaskBehavior]="true"
				type="date"
				displayFormat="dd/MM/yyyy"
				[width]="220"
				[height]="44"
			></dx-date-box>
		</div>
		<div class="filtro">
			<div class="filtro-label">Fecha Final</div>
			<dx-date-box
				class="filtro-control"
				[(value)]="vFECHA_FINAL"
				[useMaskBehavior]="true"
				type="date"
				displayFormat="dd/MM/yyyy"
				[width]="220"
				[height]="44"
			></dx-date-box>
		</div>
		<div class="filtro filtro-wide">
			<div class="filtro-label">Cuenta bancaria</div>
			<dx-select-box
				class="filtro-control"
				[dataSource]="mCORR_CUENTA_BANCO"
				displayExpr="NOMBRE_CUENTA_BANCO"
				valueExpr="CORR_CUENTA_BANCO"
				[(value)]="corrCuentaBanco"
				[searchEnabled]="true"
				[width]="320"
				[height]="44"
				(valueChange)="onCuentaBancoChanged($event)"
			></dx-select-box>
		</div>
		<div class="filtro-acciones">
			<dx-button
				class="filtro-btn"
				text="Consultar"
				type="default"
				icon="search"
				[width]="150"
				[height]="44"
				(onClick)="consultar()"
			></dx-button>
			<dx-button
				class="filtro-btn"
				text="Todos"
				type="default"
				[width]="110"
				[height]="44"
				(onClick)="selectTodos()"
			></dx-button>
			<dx-button
				class="filtro-btn"
				text="Ninguno"
				type="default"
				[width]="110"
				[height]="44"
				(onClick)="selectNinguno()"
			></dx-button>
			<dx-button
				*ngIf="btnAccion"
				class="filtro-btn"
				[text]="btnAccion"
				type="success"
				icon="check"
				[width]="190"
				[height]="44"
				(onClick)="autorizarSolicitudes()"
			></dx-button>
		</div>
	</div>
</div>

<dx-data-grid
	class="content-block dx-card responsive-paddings sguees-data-grid-mtto sguees-data-grid-mtto--enterprise"
	[dataSource]="models"
	[keyExpr]="documentoKeyExpr"
	[showBorders]="true"
	[columnAutoWidth]="false"
	[allowColumnReordering]="true"
	[allowColumnResizing]="true"
	[rowAlternationEnabled]="true"
	[hoverStateEnabled]="true"
	[twoWayBindingEnabled]="false"
	[height]="gridHeight"
>
	<dxo-load-panel [enabled]="false"></dxo-load-panel>
	<dxo-paging [pageSize]="15"></dxo-paging>
	<dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[15, 30, 50]"></dxo-pager>
	<dxo-filter-row [visible]="true"></dxo-filter-row>
	<dxo-search-panel [visible]="true"></dxo-search-panel>
	<dxo-editing mode="cell" [allowUpdating]="permiteEdit" [selectTextOnEditStart]="false"></dxo-editing>

	<dxi-column
		dataField="SELECCION"
		caption="Sel."
		dataType="boolean"
		[width]="60"
		[allowFiltering]="false"
		[allowSorting]="false"
		[allowEditing]="permiteEdit"
	></dxi-column>
	<dxi-column dataField="CORR_DOCUMENTO" caption="No. solicitud" [width]="110" [allowEditing]="false"></dxi-column>
	<dxi-column
		dataField="FECHA_EMISION"
		caption="Fecha emisión"
		dataType="date"
		[width]="130"
		format="dd/MM/yyyy"
		[allowEditing]="false"
	></dxi-column>
	<dxi-column dataField="NOMBRE_TIPO_CHEQUE" caption="Tipo cheque" [width]="160" [allowEditing]="false"></dxi-column>
	<dxi-column dataField="NOMBRE_CUENTA_BANCO" caption="Cuenta bancaria" [width]="220" [allowEditing]="false"></dxi-column>
	<dxi-column dataField="NOMBRE_BENEFICIARIO" caption="Beneficiario" [width]="220" [allowEditing]="false"></dxi-column>
	<dxi-column dataField="NOMBRE_PARTIDA" caption="Concepto" [width]="280" [allowEditing]="false"></dxi-column>
	<dxi-column
		dataField="MONTO_DOCUMENTO"
		caption="Monto"
		[width]="120"
		dataType="number"
		format="#,##0.00"
		alignment="right"
		[allowEditing]="false"
	></dxi-column>
	<dxi-column dataField="NOMBRE_ESTADO_DOCUMENTO" caption="Estado solicitud" [width]="130" [allowEditing]="false"></dxi-column>
	<dxi-column
		dataField="FECHA_SOLICITADO"
		caption="Fecha solicitado"
		dataType="date"
		[width]="130"
		format="dd/MM/yyyy"
		[allowEditing]="false"
	></dxi-column>
	<dxi-column dataField="SOLICITADO_POR" caption="Solicitado por" [width]="140" [allowEditing]="false"></dxi-column>
</dx-data-grid>

<dx-load-panel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
</div>
