<div class="sguees-mtto-view">
<app-barra-data-mtto
	[tituloVentana]="tituloVentana"
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[showRibbon]="true"
	[permiteAdd]="permiteAdd"
	[showRefresh]="true"
	[showExport]="permitePrint"
	[showDates]="true"
	[btn1]="btnAplicar"
	[btn1Icon]="'check'"
	[btn1Type]="'success'"
	(btn1Click)="aplicarConciliacion()"
	[btn2]="btnDesAplicar"
	[btn2Icon]="'revert'"
	[btn2Type]="'default'"
	(btn2Click)="desAplicarConciliacion()"
	[btn3]="btnGenerar"
	[btn3Icon]="'refresh'"
	[btn3Type]="'default'"
	(btn3Click)="generarConciliacion()"
	[btn4]="btnReconstruir"
	[btn4Icon]="'repeat'"
	[btn4Type]="'default'"
	(btn4Click)="reconstruirMovimientos()"
	[btn5]="btnImportar"
	[btn5Icon]="'exportxlsx'"
	[btn5Type]="'default'"
	(btn5Click)="importarExcelClick()"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
	(consultar)="consultar()"
	[(FECHA_INICIAL)]="vFECHA_INICIAL"
	[(FECHA_FINAL)]="vFECHA_FINAL"
>
</app-barra-data-mtto>

<div *ngIf="!isBrowse()" class="concilia-edit-shell">
	<section class="sguees-section-card concilia-form-card">
		<header class="concilia-section-head">
			<span class="concilia-section-title">Datos de conciliación</span>
			<span class="concilia-section-subtitle">Encabezado de conciliación bancaria</span>
		</header>
		<dx-form
			#fData
			id="fData"
			class="sguees-form-premium concilia-form"
			[formData]="model"
			[labelLocation]="'top'"
			[colCount]="8"
			[items]="items"
		>
			<div *dxTemplate="let cellInfo of 'CORR_CUENTA_BANCOLookup'">
				<app-data-lookup
					[model]="mCORR_CUENTA_BANCO"
					[(value)]="model.CORR_CUENTA_BANCO"
					[selectedRowKeys]="selectedLookUpCORR_CUENTA_BANCO"
					[readOnly]="readOnly"
					[valueExpr]="'CORR_CUENTA_BANCO'"
					[displayExpr]="'NOMBRE_CUENTA_BANCO'"
					[lookupColumns]="cuentaBancoLookupColumns"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'ESTADO_CONCILIACIONLookup'">
				<app-data-lookup
					[model]="mESTADO_CONCILIACION"
					[(value)]="model.ESTADO_CONCILIACION"
					[selectedRowKeys]="selectedLookUpLista"
					[readOnly]="true"
				>
				</app-data-lookup>
			</div>
		</dx-form>
	</section>

	<section class="sguees-section-card concilia-detalle-card">
		<dx-tab-panel class="concilia-tab-panel" [selectedIndex]="0">
			<dxi-item title="Resumen" icon="chart">
				<dx-data-grid
					class="theme-dependent sguees-data-grid-mtto"
					[dataSource]="resumen"
					keyExpr="CORR_LINEA"
					[columns]="resumenColumns"
					[showBorders]="true"
					[columnAutoWidth]="false"
					[height]="360"
				>
					<dxo-paging [enabled]="false"></dxo-paging>
				</dx-data-grid>
			</dxi-item>

			<dxi-item title="Conciliación" icon="link">
				<div class="concilia-split">
					<div class="concilia-split-pane">
						<div class="concilia-pane-title">Movimientos banco</div>
						<div class="concilia-deta-toolbar" *ngIf="puedeEditarDetalle()">
							<dx-button icon="add" text="Agregar" type="success" stylingMode="contained" (onClick)="agregarDetalle()" [disabled]="detalleEditando"></dx-button>
							<dx-button icon="save" text="Guardar" type="success" stylingMode="contained" (onClick)="guardarDetalleEditado()" [disabled]="!detalleEditando"></dx-button>
							<dx-button icon="revert" text="Cancelar" type="danger" stylingMode="contained" (onClick)="cancelarDetalleEditado()" [disabled]="!detalleEditando"></dx-button>
						</div>
						<dx-data-grid
							#gridDetalleBanco
							class="theme-dependent sguees-data-grid-mtto"
							[dataSource]="detalles"
							keyExpr="CORR_CONCILIACION_DETA"
							[showBorders]="true"
							[columnAutoWidth]="false"
							[height]="280"
							[selection]="{ mode: 'single' }"
							(onRowInserting)="detalleRowInserting($event)"
							(onRowUpdating)="detalleRowUpdating($event)"
							(onRowRemoving)="detalleRowRemoving($event)"
							(onRowValidating)="detalleRowValidating($event)"
							(onInitNewRow)="detalleInitNewRow($event)"
							(onEditingStart)="onDetalleEditingStart($event)"
							(onSaved)="onDetalleSaved($event)"
							(onEditCanceled)="onDetalleEditCanceled($event)"
						>
							<dxo-editing mode="row" [allowAdding]="puedeEditarDetalle()" [allowUpdating]="puedeEditarDetalle()" [allowDeleting]="puedeEditarDetalle()" [useIcons]="true"></dxo-editing>
							<dxi-column type="buttons" [width]="90">
								<dxi-button hint="Editar" icon="edit" stylingMode="text" [visible]="detalleEditButtonVisible" [onClick]="editarDetalleClick"></dxi-button>
								<dxi-button name="delete" hint="Eliminar" icon="trash" stylingMode="text" [visible]="detalleDeleteButtonVisible"></dxi-button>
							</dxi-column>
							<dxi-column dataField="FECHA_MOVIMIENTO" caption="Fecha" dataType="date" [width]="110"></dxi-column>
							<dxi-column dataField="CORR_TIPO_MOVIMIENTO" caption="Tipo" [width]="120" [editCellTemplate]="'tipoMoviTemplate'">
								<dxo-lookup [dataSource]="mCORR_TIPO_MOVIMIENTO" valueExpr="CORR_TIPO_MOVIMIENTO" displayExpr="NOMBRE_TIPO_MOVIMIENTO"></dxo-lookup>
							</dxi-column>
							<div *dxTemplate="let cellInfo of 'tipoMoviTemplate'">
								<app-data-lookup
									[setValue]="cellInfo.setValue"
									[model]="mCORR_TIPO_MOVIMIENTO"
									[(value)]="cellInfo.value"
									[selectedRowKeys]="selectedLookUpCORR_TIPO_MOVIMIENTO"
									[valueExpr]="'CORR_TIPO_MOVIMIENTO'"
									[displayExpr]="'NOMBRE_TIPO_MOVIMIENTO'"
									[lookupColumns]="tipoMoviLookupColumns"
								></app-data-lookup>
							</div>
							<dxi-column dataField="NUMERO_REFERENCIA_BANCO" caption="Referencia" [width]="130"></dxi-column>
							<dxi-column dataField="MONTO_CARGO" caption="Cargo" [width]="110" dataType="number" [format]="'#,##0.00'"></dxi-column>
							<dxi-column dataField="MONTO_ABONO" caption="Abono" [width]="110" dataType="number" [format]="'#,##0.00'"></dxi-column>
							<dxi-column dataField="NUMERO_DOCUMENTO" caption="Doc. contable" [allowEditing]="false"></dxi-column>
						</dx-data-grid>
					</div>

					<div class="concilia-split-pane">
						<div class="concilia-pane-title">Pendientes contables</div>
						<dx-data-grid
							#gridPendientes
							class="theme-dependent sguees-data-grid-mtto"
							[dataSource]="pendientes"
							[columns]="pendienteColumns"
							keyExpr="CORR_PARTIDA_DETA"
							[showBorders]="true"
							[columnAutoWidth]="false"
							[height]="320"
							[selection]="{ mode: 'single' }"
						>
							<dxo-paging [enabled]="false"></dxo-paging>
						</dx-data-grid>
					</div>
				</div>
				<div class="concilia-action-bar" *ngIf="puedeEditarDetalle()">
					<dx-button text="Conciliar" icon="link" type="success" stylingMode="contained" (onClick)="conciliarSeleccion()"></dx-button>
					<dx-button text="Revertir" icon="undo" type="default" stylingMode="contained" (onClick)="revertirSeleccion()"></dx-button>
					<dx-button text="Marcar" icon="check" type="default" stylingMode="contained" (onClick)="marcarSeleccion()"></dx-button>
				</div>
			</dxi-item>

			<dxi-item title="Detalle MOVI" icon="detailslayout">
				<dx-data-grid
					class="theme-dependent sguees-data-grid-mtto"
					[dataSource]="movimientos"
					keyExpr="CORR_MOVIMIENTO"
					[columns]="moviColumns"
					[showBorders]="true"
					[columnAutoWidth]="false"
					[height]="360"
				>
					<dxo-paging [enabled]="false"></dxo-paging>
				</dx-data-grid>
			</dxi-item>
		</dx-tab-panel>
	</section>
</div>

<input #excelInput type="file" accept=".xlsx,.xls" hidden (change)="onExcelSelected($event)" />

<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="['CORR_CUENTA_BANCO', 'CORR_CONCILIACION']"
	[columnAutoWidth]="false"
	[showSearch]="false"
	[nativeToolbar]="true"
	[unifiedToolbar]="false"
	[showAdd]="false"
	[showRefresh]="false"
	[showExport]="false"
	[showGrouping]="true"
	[permitePrint]="permitePrint"
	[exportFileName]="'ConciliacionBancaria'"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	[responsiveColumnHiding]="false"
	[columnHidingEnabled]="false"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="editarClick($event)"
>
</app-data-grid-mtto>
</div>

<dx-load-panel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
