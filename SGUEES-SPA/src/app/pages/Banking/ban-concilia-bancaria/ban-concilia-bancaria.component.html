<div class="sguees-mtto-view">
<app-barra-data-mtto
	[tituloVentana]="tituloVentana"
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[showRibbon]="true"
	[permiteAdd]="permiteAdd"
	[showRefresh]="true"
	[showExport]="permitePrint"
	[showDates]="true"
	[btn1]="btnAplicar"
	[btn1Icon]="'check'"
	[btn1Type]="'success'"
	(btn1Click)="aplicarConciliacion()"
	[btn2]="btnDesAplicar"
	[btn2Icon]="'revert'"
	[btn2Type]="'default'"
	(btn2Click)="desAplicarConciliacion()"
	[btn3]="btnGenerar"
	[btn3Icon]="'refresh'"
	[btn3Type]="'default'"
	(btn3Click)="generarConciliacion()"
	[btn4]="btnReconstruir"
	[btn4Icon]="'repeat'"
	[btn4Type]="'default'"
	(btn4Click)="reconstruirMovimientos()"
	[btn5]="btnImportar"
	[btn5Icon]="'exportxlsx'"
	[btn5Type]="'default'"
	(btn5Click)="importarArchivoClick()"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
	(consultar)="consultar()"
	[(FECHA_INICIAL)]="vFECHA_INICIAL"
	[(FECHA_FINAL)]="vFECHA_FINAL"
>
</app-barra-data-mtto>

<div *ngIf="!isBrowse()" class="concilia-edit-shell">
	<section class="sguees-section-card concilia-form-card">
		<dx-form
			#fData
			id="fData"
			class="sguees-form-premium concilia-form"
			[formData]="model"
			[labelLocation]="'left'"
			[colCount]="8"
			[items]="items"
		>
			<div *dxTemplate="let cellInfo of 'CORR_CUENTA_BANCOLookup'">
				<app-data-lookup
					[model]="mCORR_CUENTA_BANCO"
					[(value)]="model.CORR_CUENTA_BANCO"
					[selectedRowKeys]="selectedLookUpCORR_CUENTA_BANCO"
					[readOnly]="cuentaYSaldosReadOnly"
					[valueExpr]="'CORR_CUENTA_BANCO'"
					[displayExpr]="'NOMBRE_CUENTA_BANCO'"
					[lookupColumns]="cuentaBancoLookupColumns"
				>
				</app-data-lookup>
			</div>
			<div *dxTemplate="let cellInfo of 'ESTADO_CONCILIACIONLookup'">
				<app-data-lookup
					[model]="mESTADO_CONCILIACION"
					[(value)]="model.ESTADO_CONCILIACION"
					[selectedRowKeys]="selectedLookUpLista"
					[readOnly]="true"
				>
				</app-data-lookup>
			</div>
		</dx-form>
	</section>

	<section class="sguees-section-card concilia-workspace-card">
		<dx-tab-panel
			class="concilia-side-tabs"
			[tabsPosition]="'left'"
			[(selectedIndex)]="tabConciliaIndex"
			[height]="'auto'"
		>
			<dxi-item title="General">
				<div class="concilia-tab-content concilia-resumen-stack">
					<div class="concilia-resumen-block">
						<div class="concilia-resumen-title">MAS (+)</div>
						<dx-data-grid
							class="theme-dependent sguees-data-grid-mtto concilia-grid-resumen"
							[dataSource]="resumenMas"
							keyExpr="CORR_LINEA"
							[columns]="resumenLineaColumns"
							[showBorders]="true"
							[columnAutoWidth]="false"
							[height]="resumenGridHeight(resumenMas.length)"
						>
							<dxo-summary [totalItems]="resumenSummary.totalItems"></dxo-summary>
							<dxo-paging [enabled]="false"></dxo-paging>
						</dx-data-grid>
						<div class="concilia-resumen-total">
							<span>Subtotal</span>
							<strong>{{ subtotalDespuesMas | number: '1.2-2' }}</strong>
						</div>
					</div>

					<div class="concilia-resumen-block">
						<div class="concilia-resumen-title">MENOS (-)</div>
						<dx-data-grid
							class="theme-dependent sguees-data-grid-mtto concilia-grid-resumen"
							[dataSource]="resumenMenos"
							keyExpr="CORR_LINEA"
							[columns]="resumenLineaColumns"
							[showBorders]="true"
							[columnAutoWidth]="false"
							[height]="resumenGridHeight(resumenMenos.length)"
						>
							<dxo-summary [totalItems]="resumenSummary.totalItems"></dxo-summary>
							<dxo-paging [enabled]="false"></dxo-paging>
						</dx-data-grid>
					</div>

					<div class="concilia-saldo-final">
						<span>Saldo final</span>
						<strong>{{ saldoFinalConcilia | number: '1.2-2' }}</strong>
					</div>
				</div>
			</dxi-item>

			<dxi-item title="Conciliacion">
				<div class="concilia-tab-content concilia-detalle-stack">
					<div class="concilia-action-bar" *ngIf="puedeEditarDetalle()">
						<dx-button text="Conciliar" icon="link" type="success" stylingMode="contained" (onClick)="conciliarSeleccion()"></dx-button>
						<dx-button text="Revertir" icon="undo" type="default" stylingMode="contained" (onClick)="revertirSeleccion()"></dx-button>
						<dx-button text="Marca conciliado" icon="check" type="default" stylingMode="contained" (onClick)="marcarSeleccion()"></dx-button>
					</div>

					<dx-data-grid
						#gridDetalleBanco
						class="theme-dependent sguees-data-grid-mtto concilia-grid-detalle"
						[dataSource]="detalles"
						keyExpr="CORR_CONCILIACION_DETA"
						[showBorders]="true"
						[columnAutoWidth]="false"
						[height]="320"
						[selection]="{ mode: 'single' }"
					>
						<dxo-editing mode="row" [allowAdding]="false" [allowUpdating]="false" [allowDeleting]="false"></dxo-editing>
						<dxo-summary [totalItems]="detaSummary.totalItems"></dxo-summary>
						<dxi-column dataField="FECHA_MOVIMIENTO" caption="Fecha" dataType="date" [width]="100"></dxi-column>
						<dxi-column dataField="NOMBRE_TIPO_MOVIMIENTO" caption="Tipo mov." [width]="130"></dxi-column>
						<dxi-column dataField="NUMERO_REFERENCIA_BANCO" caption="Referencia" [width]="110"></dxi-column>
						<dxi-column dataField="CODIGO_TRANSACCION" caption="Código" [width]="90"></dxi-column>
						<dxi-column dataField="DESCRIPCION_TRANSACCION" caption="Descripción" [width]="140"></dxi-column>
						<dxi-column dataField="MONTO_CARGO" caption="Cargo" [width]="100" dataType="number" [format]="'#,##0.00'"></dxi-column>
						<dxi-column dataField="MONTO_ABONO" caption="Abono" [width]="100" dataType="number" [format]="'#,##0.00'"></dxi-column>
						<dxi-column dataField="ANIO_PERIODO" caption="Año" [width]="60"></dxi-column>
						<dxi-column dataField="MES_PERIODO" caption="Mes" [width]="50"></dxi-column>
						<dxi-column dataField="NUMERO_DOCUMENTO" caption="No. doc." [width]="90"></dxi-column>
						<dxi-column dataField="NOMBRE_CORTO_CLASE" caption="Clase part." [width]="90"></dxi-column>
						<dxi-column dataField="NOMBRE_TRAN" caption="Detalle transacción" [minWidth]="180"></dxi-column>
						<dxi-column dataField="MONTO_CARGO_CONTA" caption="Cargo conta" [width]="100" dataType="number" [format]="'#,##0.00'"></dxi-column>
						<dxi-column dataField="MONTO_ABONO_CONTA" caption="Abono conta" [width]="100" dataType="number" [format]="'#,##0.00'"></dxi-column>
					</dx-data-grid>

					<div class="concilia-pane-title concilia-pane-title--secondary">Movimientos contables pendientes</div>
					<dx-data-grid
						#gridPendientes
						class="theme-dependent sguees-data-grid-mtto concilia-grid-pendientes"
						[dataSource]="pendientes"
						[columns]="pendienteColumns"
						keyExpr="CORR_PARTIDA_DETA"
						[showBorders]="true"
						[columnAutoWidth]="false"
						[height]="220"
						[selection]="{ mode: 'single' }"
					>
						<dxo-filter-row [visible]="true"></dxo-filter-row>
						<dxo-paging [enabled]="false"></dxo-paging>
					</dx-data-grid>
				</div>
			</dxi-item>

			<dxi-item title="Detalle">
				<div class="concilia-tab-content">
					<div class="concilia-general-toolbar">
						<span class="concilia-general-label">Línea de trabajo</span>
						<app-data-lookup
							class="concilia-linea-select"
							[model]="lineasTrabajo"
							[(value)]="filtroLineaTrabajo"
							[valueExpr]="'CORR_LINEA'"
							[displayExpr]="'NOMBRE_LINEA_TRABAJO'"
							[showClearButton]="true"
							[lookupColumns]="lineaTrabajoLookupColumns"
						></app-data-lookup>
					</div>
					<dx-data-grid
						class="theme-dependent sguees-data-grid-mtto concilia-grid-general"
						[dataSource]="movimientosFiltrados"
						keyExpr="CORR_MOVIMIENTO"
						[columns]="moviColumns"
						[showBorders]="true"
						[columnAutoWidth]="false"
						[height]="resumenGridHeight(movimientosFiltrados.length > 0 ? movimientosFiltrados.length : 4)"
					>
						<dxo-filter-row [visible]="true"></dxo-filter-row>
						<dxo-summary [totalItems]="moviSummary.totalItems"></dxo-summary>
						<dxo-paging [enabled]="false"></dxo-paging>
					</dx-data-grid>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</section>
</div>

<input #importInput type="file" accept=".xlsx,.xls,.csv,.txt" hidden (change)="onImportFileSelected($event)" />

<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="['CORR_CUENTA_BANCO', 'CORR_CONCILIACION']"
	[columnAutoWidth]="false"
	[showSearch]="false"
	[nativeToolbar]="true"
	[unifiedToolbar]="false"
	[showAdd]="false"
	[showRefresh]="false"
	[showExport]="false"
	[showGrouping]="true"
	[permitePrint]="permitePrint"
	[exportFileName]="'ConciliacionBancaria'"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	[responsiveColumnHiding]="false"
	[columnHidingEnabled]="false"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="editarClick($event)"
>
</app-data-grid-mtto>
</div>

<dx-load-panel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
