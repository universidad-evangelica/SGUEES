<div class="sguees-mtto-view">
  <app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [showRibbon]="true"
    [permiteAdd]="permiteAdd"
    (nuevo)="nuevo()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
    [showRefresh]="true"
    [showDates]="true"
    (consultar)="consultar()"
    [(FECHA_INICIAL)]="vFECHA_INICIAL"
    [(FECHA_FINAL)]="vFECHA_FINAL"
    [btn1]="btnAplicar"
    [btn1Icon]="'check'"
    [btn1Type]="'success'"
    (btn1Click)="Aplicar()"
    [btn1Width]="100"
    [btn1Mode]="'contained'"
    [btn2]="btnAnular"
    [btn2Icon]="'close'"
    [btn2Type]="'danger'"
    (btn2Click)="Anular()"
    [btn2Width]="100"
    [btn2Mode]="'contained'"
    [btn3]="btnDesAplicar"
    [btn3Icon]="'undo'"
    [btn3Type]="'default'"
    (btn3Click)="DesAplicar()"
    [btn3Width]="120"
    [btn3Mode]="'contained'"
    [btn4]="btnVistaPrevia"
    [btn4Icon]="'export'"
    [btn4Type]="'default'"
    (btn4Click)="obtenerPDF()"
    [btn4Width]="140"
    [btn4Mode]="'contained'"
  >
  </app-barra-data-mtto>

  <div *ngIf="!isBrowse()">
    <dx-form
      #fData
      id="fData"
      [formData]="model"
      [labelLocation]="'top'"
      [colCount]="8"
      [items]="items"
    >
      <div *dxTemplate="let cellInfo of 'ESTADO_ORDEN_COMPRALookup'">
        <app-data-lookup
          [model]="mESTADO_ORDEN_COMPRA"
          [(value)]="model.ESTADO_ORDEN_COMPRA"
          [selectedRowKeys]="selectedLookUpLista"
          [readOnly]="true"
        >
        </app-data-lookup>
      </div>
      <div *dxTemplate="let cellInfo of 'CORR_PROVEEDORLookup'">
        <app-data-lookup
          [model]="mCORR_PROVEEDOR"
          [(value)]="model.CORR_PROVEEDOR"
          [valueExpr]="'CORR_PROVEEDOR'"
          [displayExpr]="'NOMBRE_PROVEEDOR'"
          [lookupColumns]="proveedorLookupColumns"
          [selectedRowKeys]="selectedLookUpCORR_PROVEEDOR"
          [readOnly]="readOnly"
        >
        </app-data-lookup>
      </div>
      <div *dxTemplate="let cellInfo of 'CORR_CONDICION_PAGOLookup'">
        <app-data-lookup
          [model]="mCORR_CONDICION_PAGO"
          [(value)]="model.CORR_CONDICION_PAGO"
          [valueExpr]="'CORR_CONDICION_PAGO'"
          [displayExpr]="'NOMBRE_CONDICION_PAGO'"
          [selectedRowKeys]="selectedLookUpCORR_CONDICION_PAGO"
          [readOnly]="readOnly"
        >
        </app-data-lookup>
      </div>
      <div *dxTemplate="let cellInfo of 'CORR_FORMA_PAGOLookup'">
        <app-data-lookup
          [model]="mCORR_FORMA_PAGO"
          [(value)]="model.CORR_FORMA_PAGO"
          [valueExpr]="'CORR_FORMA_PAGO'"
          [displayExpr]="'NOMBRE_FORMA_PAGO'"
          [selectedRowKeys]="selectedLookUpCORR_FORMA_PAGO"
          [readOnly]="readOnly"
        >
        </app-data-lookup>
      </div>
    </dx-form>

    <dx-tab-panel #tabPanel [selectedIndex]="0">
      <dxi-item title="Detalle de Ítem" [icon]="'cart'">
        <div class="dx-grid-deta">
          <dx-data-grid
            #DataOrdenCompraDetalle
            [dataSource]="mCOM_ORDEN_COMPRA_DETA"
            [columnAutoWidth]="false"
            [showBorders]="true"
            [showColumnLines]="true"
            [showRowLines]="true"
            [rowAlternationEnabled]="true"
            [hoverStateEnabled]="true"
            [allowColumnResizing]="true"
            [columnResizingMode]="'widget'"
            [repaintChangesOnly]="true"
            [focusedRowEnabled]="true"
            [height]="'100%'"
            [width]="'100%'"
            [keyExpr]="'CORR_ORDEN_COMPRA_DETA'"
            (onRowInserting)="detalleRowInserting($event)"
            (onRowUpdating)="detalleRowUpdating($event)"
            (onRowRemoving)="detalleRowRemoving($event)"
            (onEditorPreparing)="onDetalleEditorPreparing($event)"
          >
            <dxo-keyboard-navigation [editOnKeyPress]="true"></dxo-keyboard-navigation>
            <dxo-toolbar>
              <dxi-item name="addRowButton" location="before"></dxi-item>
              <dxi-item name="exportButton" location="after"></dxi-item>
              <dxi-item name="searchPanel" location="after"></dxi-item>
            </dxo-toolbar>
            <dxo-editing
              [mode]="'cell'"
              [refreshMode]="'reshape'"
              [allowUpdating]="puedeEditarDetalle()"
              [allowAdding]="puedeEditarDetalle()"
              [allowDeleting]="puedeEditarDetalle()"
              [useIcons]="true"
            >
            </dxo-editing>
            <dxo-load-panel [enabled]="false"></dxo-load-panel>
            <dxo-search-panel [visible]="true"></dxo-search-panel>
            <dxo-export [enabled]="true" fileName="Detalle Orden Compra"></dxo-export>
            <dxi-column dataField="CODIGO_ITEM" caption="Código" [dataType]="'string'" [width]="'120px'">
            </dxi-column>
            <dxi-column dataField="NOMBRE_ITEM" caption="Descripción" [dataType]="'string'" [width]="'300px'" [allowEditing]="false">
            </dxi-column>
            <dxi-column
              dataField="CORR_UNIDAD_MEDIDA"
              caption="Unidad"
              [width]="'140px'"
              editCellTemplate="CORR_UNIDAD_MEDIDALookup"
            >
              <dxo-lookup
                [dataSource]="mCORR_UNIDAD_MEDIDA"
                valueExpr="CORR_UNIDAD_MEDIDA"
                displayExpr="NOMBRE_UNIDAD_MEDIDA"
              ></dxo-lookup>
            </dxi-column>
            <div *dxTemplate="let cellInfo of 'CORR_UNIDAD_MEDIDALookup'">
              <app-data-lookup
                [model]="mCORR_UNIDAD_MEDIDA"
                [(value)]="cellInfo.data.CORR_UNIDAD_MEDIDA"
                [valueExpr]="'CORR_UNIDAD_MEDIDA'"
                [displayExpr]="'NOMBRE_UNIDAD_MEDIDA'"
                [lookupColumns]="unidadLookupColumns"
                [selectedRowKeys]="selectedLookUpCORR_UNIDAD_MEDIDA"
                [setValue]="cellInfo.setValue"
                [readOnly]="!puedeEditarDetalle()"
              >
              </app-data-lookup>
            </div>
            <dxi-column
              dataField="CANTIDAD"
              caption="Cantidad"
              [dataType]="'number'"
              [editorOptions]="{ format: '#,##0.00' }"
              [width]="'100'"
            >
            </dxi-column>
            <dxi-column
              dataField="PRECIO_UNITARIO"
              caption="Precio U."
              [dataType]="'number'"
              [editorOptions]="{ format: '#,##0.0000' }"
              [width]="'110px'"
            >
            </dxi-column>
            <dxi-column
              dataField="MONTO_SUBTOTAL"
              caption="Total"
              [dataType]="'number'"
              [allowEditing]="false"
              [editorOptions]="{ format: '#,##0.00', readOnly: true }"
              [width]="'110px'"
            >
            </dxi-column>
            <dxo-summary>
              <dxi-total-item
                column="CODIGO_ITEM"
                summaryType="count"
                valueFormat="#,##0"
                displayFormat="Cant: {0}"
              >
              </dxi-total-item>
              <dxi-total-item
                column="MONTO_SUBTOTAL"
                summaryType="sum"
                valueFormat="#,##0.00"
                displayFormat="{0}"
              >
              </dxi-total-item>
            </dxo-summary>
          </dx-data-grid>
        </div>
      </dxi-item>

      <dxi-item
        title="Autorizaciones cuadro"
        [icon]="'user'"
        [visible]="tieneCuadroComparativo()"
      >
        <div class="dx-grid-deta">
          <dx-data-grid
            #DataCuadroComparativoAutorizaciones
            [dataSource]="mCOM_ORDEN_COMPRA_AUTORIZACIONES"
            [columnAutoWidth]="false"
            [showBorders]="true"
            [showColumnLines]="true"
            [showRowLines]="true"
            [rowAlternationEnabled]="true"
            [hoverStateEnabled]="true"
            [allowColumnResizing]="true"
            [columnResizingMode]="'widget'"
            [repaintChangesOnly]="true"
            [focusedRowEnabled]="true"
            [height]="'100%'"
            [width]="'100%'"
            [editing]="{ mode: 'cell', allowUpdating: false }"
            [keyExpr]="[
              'CORR_EMPRESA',
              'LOGIN_SISTEMA',
              'ANIO_PERIODO',
              'CORR_CUADRO_COMPARATIVO'
            ]"
          >
            <dxo-keyboard-navigation [editOnKeyPress]="true"></dxo-keyboard-navigation>
            <dxo-toolbar>
              <dxi-item name="exportButton" location="after"></dxi-item>
              <dxi-item name="searchPanel" location="after"></dxi-item>
            </dxo-toolbar>
            <dxo-editing
              [mode]="'cell'"
              [refreshMode]="'reshape'"
              [allowUpdating]="false"
              [allowAdding]="false"
              [allowDeleting]="false"
              [useIcons]="true"
            >
            </dxo-editing>
            <dxo-load-panel [enabled]="false"></dxo-load-panel>
            <dxo-search-panel [visible]="true"></dxo-search-panel>
            <dxo-export [enabled]="true" fileName="Autorizaciones"></dxo-export>
            <dxi-column dataField="LOGIN_SISTEMA" caption="Usuario" [visible]="false" [dataType]="'string'" [width]="'100px'">
            </dxi-column>
            <dxi-column dataField="NOMBRE_USUARIO" caption="Usuario" [dataType]="'string'" [width]="'250px'">
            </dxi-column>
            <dxi-column
              dataField="FECHA_AUTORIZACION"
              caption="Fecha Autorización"
              [editorOptions]="{ readOnly: true }"
              [dataType]="'datetime'"
              [format]="'dd/MM/yyyy HH:mm'"
              [width]="'200px'"
            >
            </dxi-column>
            <dxi-column dataField="NOMBRE_ESTADO_AUTORIZACION" caption="Estado Autorización" [dataType]="'string'" [width]="'150px'">
            </dxi-column>
            <dxi-column
              dataField="ORDEN_REVISION"
              caption="Orden Revisión"
              [dataType]="'number'"
              [editorOptions]="{ format: 'N0', readOnly: true }"
              [width]="'120px'"
            >
            </dxi-column>
            <dxo-summary>
              <dxi-total-item
                column="LOGIN_SISTEMA"
                summaryType="count"
                valueFormat="#,##0"
                displayFormat="Cant: {0}"
              >
              </dxi-total-item>
            </dxo-summary>
          </dx-data-grid>
        </div>
      </dxi-item>
    </dx-tab-panel>
  </div>

  <app-data-grid-mtto
    [isBrowse]="isBrowse()"
    [models]="models"
    [columns]="columns"
    [summary]="summary"
    [keyExpr]="['ANIO_PERIODO', 'CORR_ORDEN_COMPRA']"
    [permiteEditar]="getPermiteEditar"
    [permiteDele]="getPermiteDele"
    (editClick)="editarClick($event)"
    (rowDblClick)="rowDblClick($event)"
    (rowRemoving)="rowRemoving($event)"
    (focusedRowChanged)="focusedRowChanged($event)"
    [filterValue]="FilterValue"
  >
  </app-data-grid-mtto>
</div>

<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  (onShown)="(loadingVisible)"
>
</dx-load-panel>

<dx-popup
  [width]="'1200px'"
  [position]="'top'"
  [height]="'1050px'"
  [showTitle]="true"
  title="Vista Previa"
  [dragEnabled]="false"
  [closeOnOutsideClick]="false"
  [showCloseButton]="true"
  [shading]="false"
  [(visible)]="popupVisiblePdf"
  class="popout"
>
  <object [data]="PDF" type="application/pdf" width="100%" height="95%">
    <embed [src]="PDF" type="application/pdf" />
  </object>
</dx-popup>
