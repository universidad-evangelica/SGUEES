<div class="sguees-mtto-view movimiento-mtto">
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[subTituloVentana]="subTituloVentana"
		[showRibbon]="true"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="true"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
		[btn1]="btnEnviarMovimiento"
		[btn1Icon]="'send'"
		[btn1Type]="'default'"
		[btn1Width]="180"
		(btn1Click)="enviarMovimiento()"
		[btn2]="btnConfirmarMovimiento"
		[btn2Icon]="'check'"
		[btn2Type]="'success'"
		[btn2Width]="130"
		(btn2Click)="confirmarMovimiento()"
	>
	</app-barra-data-mtto>

	<div class="content-block dx-card responsive-paddings" *ngIf="!isBrowse()">
		<dx-tab-panel [selectedIndex]="0" class="movimiento-tab-panel">
			<dxi-item title="Datos del movimiento" [icon]="'card'">
				<dx-form
					#fData
					id="fData"
					class="mt-20"
					[formData]="model"
					[labelLocation]="'top'"
					[colCount]="8"
					[items]="items"
				>
					<!-- Chip de estado (solo lectura; lo mueve el flujo Autoriza). -->
					<div *dxTemplate="let cellInfo of 'ESTADO_MOVIMIENTOChip'">
						<span
							class="estado-mov-chip"
							[ngClass]="getEstadoBadgeClass(model.ESTADO_MOVIMIENTO)"
							[title]="getEstadoLabel(model.ESTADO_MOVIMIENTO)"
						>
							{{ getEstadoLabel(model.ESTADO_MOVIMIENTO) }}
						</span>
					</div>

					<div *dxTemplate="let cellInfo of 'CORR_UNIDAD_ACTUALLookup'">
						<app-data-lookup
							[model]="mCORR_UNIDAD"
							[(value)]="model.CORR_UNIDAD_ACTUAL"
							[selectedRowKeys]="selectedLookUpCORR_UNIDAD_ACTUAL"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_UNIDAD'"
							[displayExpr]="'NOMBRE_UNIDAD'"
							[lookupColumns]="unidadLookupColumns"
						>
						</app-data-lookup>
					</div>

					<div *dxTemplate="let cellInfo of 'CORR_PUESTO_ACTUALLookup'">
						<app-data-lookup
							[model]="mCORR_PUESTO_ACTUAL"
							[(value)]="model.CORR_PUESTO_ACTUAL"
							[selectedRowKeys]="selectedLookUpCORR_PUESTO_ACTUAL"
							[readOnly]="readOnly || !model.CORR_UNIDAD_ACTUAL"
							[valueExpr]="'CORR_PUESTO'"
							[displayExpr]="'NOMBRE_PUESTO'"
							[lookupColumns]="puestoLookupColumns"
						>
						</app-data-lookup>
					</div>

					<div *dxTemplate="let cellInfo of 'CORR_TIPO_MODALIDAD_ACTUALLookup'">
						<app-data-lookup
							[model]="mCORR_TIPO_MODALIDAD"
							[(value)]="model.CORR_TIPO_MODALIDAD_ACTUAL"
							[selectedRowKeys]="selectedLookUpCORR_TIPO_MODALIDAD"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_TIPO_MODALIDAD'"
							[displayExpr]="'MODALIDAD_NOMBRE'"
							[lookupColumns]="modalidadLookupColumns"
						>
						</app-data-lookup>
					</div>

					<div *dxTemplate="let cellInfo of 'CORR_UNIDAD_PROPUESTALookup'">
						<app-data-lookup
							[model]="mCORR_UNIDAD"
							[(value)]="model.CORR_UNIDAD_PROPUESTA"
							[selectedRowKeys]="selectedLookUpCORR_UNIDAD_PROPUESTA"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_UNIDAD'"
							[displayExpr]="'NOMBRE_UNIDAD'"
							[lookupColumns]="unidadLookupColumns"
						>
						</app-data-lookup>
					</div>

					<div *dxTemplate="let cellInfo of 'CORR_PUESTO_PROPUESTOLookup'">
						<app-data-lookup
							[model]="mCORR_PUESTO_PROPUESTO"
							[(value)]="model.CORR_PUESTO_PROPUESTO"
							[selectedRowKeys]="selectedLookUpCORR_PUESTO_PROPUESTO"
							[readOnly]="readOnly || !model.CORR_UNIDAD_PROPUESTA"
							[valueExpr]="'CORR_PUESTO'"
							[displayExpr]="'NOMBRE_PUESTO'"
							[lookupColumns]="puestoLookupColumns"
						>
						</app-data-lookup>
					</div>

					<div *dxTemplate="let cellInfo of 'CORR_TIPO_MODALIDAD_PROPUESTALookup'">
						<app-data-lookup
							[model]="mCORR_TIPO_MODALIDAD"
							[(value)]="model.CORR_TIPO_MODALIDAD_PROPUESTA"
							[selectedRowKeys]="selectedLookUpCORR_TIPO_MODALIDAD"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_TIPO_MODALIDAD'"
							[displayExpr]="'MODALIDAD_NOMBRE'"
							[lookupColumns]="modalidadLookupColumns"
						>
						</app-data-lookup>
					</div>
				</dx-form>
			</dxi-item>

			<!-- Bitácora del motor SEG_FLUJO (vacía hasta configurar tipo documento). -->
			<dxi-item title="Bitácora" [icon]="'checklist'">
				<div class="dx-grid-deta">
					<dx-data-grid
						[dataSource]="modelsBitacora"
						[columns]="columnsBitacora"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[columnAutoWidth]="true"
						[wordWrapEnabled]="true"
						[height]="'100%'"
						[width]="'100%'"
					>
						<dxo-search-panel [visible]="true"></dxo-search-panel>
						<dxo-paging [pageSize]="10"></dxo-paging>
						<dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]"></dxo-pager>
						<dxo-editing [allowUpdating]="false" [allowDeleting]="false" [allowAdding]="false"></dxo-editing>
					</dx-data-grid>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</div>

	<app-data-grid-mtto
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[focusedRowKey]="gridFocusedRowKey"
		[permiteEditar]="getPermiteEditar"
		[permiteDele]="getPermiteDele"
		[responsiveColumnHiding]="false"
		[columnHidingEnabled]="false"
		[exportFileName]="'MovimientoPersonal'"
		(rowDblClick)="rowDblClick($event)"
		(rowRemoving)="rowRemoving($event)"
		(focusedRowChanged)="focusedRowChanged($event)"
		(editClick)="editarClick($event)"
	>
	</app-data-grid-mtto>
</div>

<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
