<!-- Contenedor principal del mantenimiento de Competencias Técnicas. -->
<div class="sguees-mtto-view">
<!-- Toolbar: nuevo, guardar y cancelar. -->
<app-barra-data-mtto
	[tituloVentana]="tituloVentana"
	[subTituloVentana]="subTituloVentana"
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[permiteAdd]="permiteAdd"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
>
</app-barra-data-mtto>

<!-- Formulario de alta/edición (oculto en browse). -->
<div class="content-block dx-card responsive-paddings competencias-tecnicas-page competencias-form-card" *ngIf="!isBrowse()">
	<dx-form
		#fData
		id="fData"
		[formData]="model"
		[labelLocation]="'top'"
		[colCount]="mttoFormColCount"
		[colCountByScreen]="mttoFormColCountByScreen"
		[showRequiredMark]="false"
		[items]="items"
	>
		<!-- Template del lookup de nivel jerárquico. -->
		<div *dxTemplate="let data of 'NIVELLookup'">
			<app-data-lookup
				[model]="mNIVEL"
				[value]="model.NIVEL"
				(valueChange)="onNivelChanged($event)"
				[valueExpr]="'Key'"
				[displayExpr]="'Value'"
				[lookupColumns]="nivelLookupColumns"
				[selectedRowKeys]="selectedLookUpNIVEL"
				[showClearButton]="false"
				[readOnly]="banderaMtto !== UpdateType.Add"
				[dropDownWidth]="280"
			></app-data-lookup>
		</div>
		<!-- Template del lookup de competencia padre. -->
		<div *dxTemplate="let data of 'CORR_COMPETENCIAS_TECNICAS_PADRELookup'">
			<div class="padre-lookup-field" [class.padre-lookup-field--invalid]="padreInvalido">
				<app-data-lookup
					[model]="padres"
					[value]="model.CORR_COMPETENCIAS_TECNICAS_PADRE"
					(valueChange)="onPadreChanged($event)"
					[valueExpr]="'CORR_COMPETENCIAS_TECNICAS'"
					[displayExpr]="'NOMBRE_DISPLAY'"
					[lookupColumns]="padreLookupColumns"
					[selectedRowKeys]="selectedLookUpCORR_COMPETENCIAS_TECNICAS_PADRE"
					[showClearButton]="true"
					[readOnly]="banderaMtto !== UpdateType.Add"
					[dropDownWidth]="640"
				></app-data-lookup>
			</div>
		</div>
	</dx-form>
</div>

<!-- Grilla del catálogo con acciones de mantenimiento. -->
<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="mttoGridKeyExpr"
	[pageSize]="mttoPageSize"
	[allowedPageSizes]="mttoPageSizes"
	[remoteOperations]="mttoRemoteOperations"
	[repaintChangesOnly]="false"
	[showSearch]="false"
	[showAdd]="true"
	[showRefresh]="true"
	[showExport]="true"
	[showEstadoToolbar]="true"
	[campoEstado]="mttoCampoEstado"
	[puedeCambiarEstado]="permiteEdit"
	[focusedRowKey]="gridFocusedRowKey"
	[permitePrint]="permitePrint"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	[responsiveColumnHiding]="false"
	[columnHidingEnabled]="false"
	[exportFileName]="'CompetenciasTecnicas'"
	(refresh)="consultar()"
	(add)="nuevo()"
	(activarInactivar)="activar_inactivar()"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="onEditClick($event)"
></app-data-grid-mtto>

</div>

<!-- Panel de carga durante operaciones asíncronas. -->
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
