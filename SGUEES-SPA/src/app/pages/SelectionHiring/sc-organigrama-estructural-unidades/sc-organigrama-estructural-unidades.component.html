<!-- Qué hace: pantalla del organigrama. La barra global vive solo en este encabezado. -->
<div class="sguees-mtto-view">
<!-- Qué hace: título del organigrama, sin la pestaña Principal. Nuevo sigue en el árbol. -->
<app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [permiteAdd]="false"
    [showRefresh]="true"
    (consultar)="consultar()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
>
</app-barra-data-mtto>

<!-- Qué hace: árbol de unidades mientras no se está editando. -->
<section class="sguees-section-card" *ngIf="isBrowse()">
    <app-mtto-header
        [title]="'Unidades del Organigrama'"
        [subtitle]="'Vista jerarquica de la estructura organizativa'"
    >
        <dx-button
            text="Actualizar"
            icon="refresh"
            stylingMode="text"
            (onClick)="consultar()"
        >
        </dx-button>
        <dx-button
            *ngIf="permiteAdd"
            text="Nuevo"
            type="default"
            stylingMode="contained"
            icon="plus"
            (onClick)="nuevo()"
        >
        </dx-button>
    </app-mtto-header>
<dx-tree-view
    #treeView
    [dataSource]="unidades"
    dataStructure="plain"
    keyExpr="CORR_UNIDAD"
    displayExpr="NOMBRE_UNIDAD_TREE"
    parentIdExpr="CORR_UNIDAD_PADRE"
    [showCheckBoxesMode]="'none'"
    [searchEnabled]="true"
    [searchTimeout]="200"
    [selectionMode]="'single'"
    itemTemplate="unidadItem"
    (onItemClick)="onUnidadSeleccionada($event)"
>
    <div *dxTemplate="let itemData of 'unidadItem'" class="unidad-tree-row">
        <span class="unidad-tree-row__text">{{ itemData.NOMBRE_UNIDAD_TREE }}</span>

        <dx-button
            *ngIf="permiteDele"
            icon="trash"
            hint="Eliminar registro"
            stylingMode="text"
            elementAttr="{ class: 'sguees-grid-action-delete' }"
            (onClick)="onTreeDeleteClick(itemData, $event)"
        >
        </dx-button>
    </div>
</dx-tree-view>
</section>

<!-- Qué hace: formulario de la unidad. Guardar y Cancelar están en la barra de arriba. -->
<div class="content-block dx-card responsive-paddings" *ngIf="isForm()">
    <dx-form #fData id="fData" [formData]="unidadModel" [labelLocation]="'top'" [colCount]="8" [items]="items">
        <!-- Qué hace: combo de nivel con el catálogo GetCORR_NIVELES. -->
        <div *dxTemplate="let cellInfo of 'CORR_NIVELESLookup'">
            <app-data-lookup
                [model]="mCORR_NIVEL"
                [(value)]="unidadModel.CORR_NIVEL"
                [valueExpr]="'CORR_NIVEL'"
                [displayExpr]="'NOMBRE_NIVEL'"
                [lookupColumns]="nivelLookupColumns"
                (valueChange)="onNivelChange($event)"
                [selectedRowKeys]="selectedLookUpCORR_NIVEL"
                [readOnly]="readOnly"
            >
            </app-data-lookup>
        </div>
        <!-- Qué hace: combo de unidad padre con el catálogo GetCORR_UNIDADES. -->
        <div *dxTemplate="let cellInfo of 'CORR_UNIDADESLookup'">
            <app-data-lookup
                [model]="mCORR_UNIDAD"
                [(value)]="unidadModel.CORR_UNIDAD_PADRE"
                [valueExpr]="'CORR_UNIDAD'"
                [displayExpr]="'NOMBRE_UNIDAD_TREE'"
                [lookupColumns]="unidadLookupColumns"
                [selectedRowKeys]="selectedLookUpCORR_UNIDAD"
                [readOnly]="readOnly"
            >
            </app-data-lookup>
        </div>
    </dx-form>
</div>

<!-- ================================================ -->
<!-- LOAD PANEL                                       -->
<!-- ================================================ -->
<dx-load-panel
    #loadPanel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
    [(visible)]="loadingVisible"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
>
</dx-load-panel>
<!-- Qué hace: jefes de la unidad abierta. Sus botones no usan la barra global. -->
<section class="sguees-section-card organigrama-section-card" *ngIf="isForm() && unidadModel && unidadModel.CORR_UNIDAD > 0">
    <header class="organigrama-section-head">
        <span class="organigrama-section-title">Jefes de la Unidad</span>
        <span class="organigrama-section-subtitle">Empleados asignados como jefes de {{ unidadModel.NOMBRE_UNIDAD }}</span>
    </header>

    <!-- Qué hace: Nuevo, Guardar y Cancelar del jefe, sin la barra de mantenimiento. -->
    <div class="organigrama-jefes-toolbar" *ngIf="(isJefeBrowse() && getPermiteAddJefe) || !isJefeBrowse()">
        <dx-button
            *ngIf="isJefeBrowse() && getPermiteAddJefe"
            class="organigrama-jefes-toolbar-btn"
            icon="plus"
            text="Nuevo"
            type="success"
            stylingMode="contained"
            (onClick)="nuevoJefe()"
        ></dx-button>
        <dx-button
            *ngIf="!isJefeBrowse()"
            class="organigrama-jefes-toolbar-btn"
            icon="save"
            text="Guardar"
            type="success"
            stylingMode="contained"
            (onClick)="guardarJefe()"
        ></dx-button>
        <dx-button
            *ngIf="!isJefeBrowse()"
            class="organigrama-jefes-toolbar-btn"
            icon="close"
            text="Cancelar"
            type="danger"
            stylingMode="contained"
            (onClick)="cancelarJefe()"
        ></dx-button>
    </div>

    <!-- Formulario de Jefe -->
    <div *ngIf="!isJefeBrowse()" >
        <dx-form #fDataJefe id="fDataJefe" [formData]="jefeModel" [labelLocation]="'top'" [colCount]="8" [items]="jefesItems">
            <!-- Template para combo de empleados -->
            <div *dxTemplate="let cellInfo of 'CORR_EMPLEADOLookup'">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <!-- Filtro de unidad -->
                    <dx-select-box
                        [dataSource]="unidades"
                        [value]="filtroUnidadJefe"
                        displayExpr="NOMBRE_UNIDAD_TREE"
                        valueExpr="CORR_UNIDAD"
                        placeholder="Filtrar por unidad..."
                        [showClearButton]="true"
                        (onValueChanged)="onFiltroUnidadJefeChanged($event.value)"
                        style="width: 250px;"
                    >
                    </dx-select-box>
                    
                    <!-- Selector de empleado -->
                    <app-data-lookup
                        [model]="empleadosDisponibles"
                        [(value)]="jefeModel.CORR_EMPLEADO"
                        [valueExpr]="'CORR_EMPLEADO'"
                        [displayExpr]="'NOMBRE_EMPLEADO'"
                        [lookupColumns]="[
                            { dataField: 'NOMBRE_EMPLEADO', caption: 'Empleado', width: 200 },
                            { dataField: 'NOMBRE_PUESTO', caption: 'Puesto', width: 200 },
                            { dataField: 'UNIDAD_EMPLEADO', caption: 'Unidad', width: 200 }
                        ]"
                        [selectedRowKeys]="selectedLookUpEMPLEADO"
                        [readOnly]="jefeReadOnly"
                        style="flex: 1;"
                    >
                    </app-data-lookup>
                </div>
            </div>
        </dx-form>
    </div>

    <!-- Qué hace: lista los jefes que ya devolvió la consulta de la unidad. -->
    <!-- Cómo lo hace: grilla normal, la de mantenimiento dejaba el paginador en -1 y no pintaba las filas. -->
    <dx-data-grid
        *ngIf="isJefeBrowse()"
        class="theme-dependent sguees-data-grid-mtto"
        [dataSource]="jefesModels"
        keyExpr="CORR_JEFE"
        [columnAutoWidth]="false"
        [showBorders]="true"
        [showColumnLines]="true"
        [showRowLines]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [allowColumnResizing]="true"
        [columnResizingMode]="'widget'"
        [width]="'100%'"
        noDataText="Sin jefes asignados."
        (onRowDblClick)="rowDblClickJefe($event)"
    >
        <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
        <dxo-pager [visible]="true" [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 25]" [showInfo]="true"></dxo-pager>
        <dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
        <dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
        <dxo-load-panel [enabled]="false"></dxo-load-panel>
        <dxi-column caption="" [width]="90" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesJefeTpl" alignment="center"></dxi-column>
        <div *dxTemplate="let cell of 'accionesJefeTpl'">
            <dx-button *ngIf="permiteEdit" icon="edit" stylingMode="text" hint="Editar" (onClick)="editarJefe(cell.data)"></dx-button>
            <dx-button *ngIf="permiteDele" icon="trash" stylingMode="text" hint="Eliminar" (onClick)="pedirEliminarJefe(cell.data)"></dx-button>
        </div>
        <dxi-column dataField="CORR_JEFE" caption="Corr." [width]="90" dataType="number"></dxi-column>
        <dxi-column dataField="NOMBRE_EMPLEADO" caption="Empleado" [width]="280" [minWidth]="200"></dxi-column>
        <dxi-column dataField="NOMBRE_PUESTO" caption="Puesto" [width]="260" [minWidth]="180"></dxi-column>
        <dxi-column dataField="FECHA_INICIO" caption="Fecha inicio" [width]="140" dataType="date" format="dd/MM/yyyy"></dxi-column>
        <dxi-column dataField="FECHA_FIN" caption="Fecha fin" [width]="140" cellTemplate="fechaFinJefeTpl"></dxi-column>
        <div *dxTemplate="let cell of 'fechaFinJefeTpl'">
            {{ cell.value ? (cell.value | date:'dd/MM/yyyy') : 'Activo' }}
        </div>
        <dxi-column dataField="ACTIVO" caption="Activo" [width]="100" alignment="center" cellTemplate="activoJefeTpl"></dxi-column>
        <div *dxTemplate="let cell of 'activoJefeTpl'">
            {{ cell.value ? 'Sí' : 'No' }}
        </div>
    </dx-data-grid>
</section>
</div>
