<!-- Qué hace: pantalla de niveles. La barra global vive solo en este encabezado. -->
<div class="sguees-mtto-view">
<app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [showRibbon]="true"
    [showExport]="permitePrint"
    [showRefresh]="true"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [permiteAdd]="permiteAdd"
    (nuevo)="nuevo()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
    (consultar)="consultar()"
>
</app-barra-data-mtto>

<!-- Qué hace: formulario del nivel. Guardar y Cancelar están en la barra de arriba. -->
<div class="content-block dx-card responsive-paddings" *ngIf="isForm()">
    <dx-form #fData id="fData" [formData]="model" [labelLocation]="'top'" [colCount]="8" [items]="items">
    </dx-form>
</div>

<!-- Qué hace: listado de niveles. La barra de arriba es la del ribbon; esta grilla no arma otra. -->
<app-data-grid-mtto
    [isBrowse]="isBrowse()"
    [models]="models"
    [columns]="columns"
    [keyExpr]="'CORR_NIVEL'"
    [nativeToolbar]="true"
    [unifiedToolbar]="false"
    [showAdd]="false"
    [showSearch]="false"
    [showExport]="false"
    [showRefresh]="false"
    [permiteEditar]="getPermiteEditar"
    [permiteDele]="getPermiteDele"
    (rowDblClick)="rowDblClick($event)"
    (rowRemoving)="rowRemoving($event)"
    (focusedRowChanged)="focusedRowChanged($event)"
    (editClick)="editarClick($event)"
>
</app-data-grid-mtto>

<dx-load-panel
    #loadPanel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
    [(visible)]="loadingVisible"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
>
</dx-load-panel>
</div>
