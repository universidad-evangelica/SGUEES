<app-barra-data-mtto
	[tituloVentana]="tituloVentana"
	[subTituloVentana]="subTituloVentana" --Esto debe de agregarse por componente ya que de etools no viene.
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[permiteAdd]="permiteAdd"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
>
</app-barra-data-mtto>
<div class="content-block dx-card responsive-paddings" *ngIf="!isBrowse()">

	<!--
		dx-tab-panel: pestañas debajo del formulario (patrón con-centro-costo / com-orden-compra).
		Solo visible en agregar/editar (*ngIf del contenedor padre).
	-->
	<dx-tab-panel #tabPanelRequisicion class="requisicion-tab-panel" [selectedIndex]="0">
		<!-- TAB 1: Detalle / Bitácora (data quemada; luego API) -->
		<dxi-item title="Datos requisición" [icon]="'event'">
				<dx-form class="mt-20" #fData id="fData" [formData]="model" [labelLocation]="'top'" [colCount]="8" [items]="items">
					<div *dxTemplate="let cellInfo of 'CORR_TIPO_MODALIDADLookup'">
						<app-data-lookup
							[model]="mCORR_TIPO_MODALIDAD"
							[(value)]="model.CORR_TIPO_MODALIDAD"
							[selectedRowKeys]="selectedLookUpCORR_TIPO_MODALIDAD"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_TIPO_MODALIDAD'"
							[displayExpr]="'MODALIDAD_NOMBRE'"
							[lookupColumns]="tipoModalidadLookupColumns"
						>
						</app-data-lookup>
					</div>
					<div *dxTemplate="let cellInfo of 'CORR_TIPO_CONTRATACIONLookup'">
						<app-data-lookup
							[model]="mCORR_TIPO_CONTRATACION"
							[(value)]="model.CORR_TIPO_CONTRATACION"
							[selectedRowKeys]="selectedLookUpCORR_TIPO_CONTRATACION"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_TIPO_CONTRATACION'"
							[displayExpr]="'NOMBRE_TIPO_CONTRATACION'"
							[lookupColumns]="tipoContratacionLookupColumns"
						>
						</app-data-lookup>
					</div>
					<div *dxTemplate="let cellInfo of 'CORR_TIPO_VACANTELookup'">
						<app-data-lookup
							[model]="mCORR_TIPO_VACANTE"
							[(value)]="model.CORR_TIPO_VACANTE"
							[selectedRowKeys]="selectedLookUpCORR_TIPO_VACANTE"
							[readOnly]="readOnly"
							[valueExpr]="'CORR_TIPO_VACANTE'"
							[displayExpr]="'NOMBRE_TIPO_VACANTE'"
							[lookupColumns]="tipoVacanteLookupColumns"
						>
						</app-data-lookup>
					</div>
				</dx-form>
		</dxi-item>

		<!-- TAB 2: Bitácora (data quemada; luego API) -->
		<dxi-item title="Bitácora requisición" [icon]="'checklist'">

		</dxi-item>

	</dx-tab-panel>
</div>
<!-- Segundo Card: observadores (solo lectura) — patrón dx-data-grid como con-partida -->
<div class="content-block dx-card responsive-paddings mt-20" *ngIf="!isBrowse()">
	<dx-tab-panel #tabPanelObservadores class="requisicion-tab-panel" [selectedIndex]="0">
		<dxi-item title="Observadores" [icon]="'group'">
			<div class="dx-grid-deta">
				<dx-data-grid
					#gridObservadores
					[dataSource]="modelsObservadores"
					[columns]="columnsObservadores"
					keyExpr="CORR_REQUISICION_OBSERVADORES"
					[showBorders]="true"
					[showColumnLines]="true"
					[showRowLines]="true"
					[rowAlternationEnabled]="true"
					[hoverStateEnabled]="true"
					[allowColumnResizing]="true"
					[columnResizingMode]="'widget'"
					[columnAutoWidth]="true"
					[height]="'100%'"
					[width]="'100%'"
				>
					<dxo-search-panel [visible]="true"></dxo-search-panel>
					<dxo-paging [pageSize]="10"></dxo-paging>
					<dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]"></dxo-pager>
					<dxo-editing [allowUpdating]="false" [allowDeleting]="false" [allowAdding]="false"></dxo-editing>
					<dxo-summary>
						<dxi-total-item
							column="CORR_REQUISICION_OBSERVADORES"
							summaryType="count"
							valueFormat="#,##0"
							displayFormat="Cant: {0}"
						></dxi-total-item>
					</dxo-summary>
				</dx-data-grid>
			</div>
		</dxi-item>
	</dx-tab-panel>
</div>

<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="'CORR_REQUISICION_PERSONAL'"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="editarClick($event)"
>
</app-data-grid-mtto>
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
	(onShown)="(loadingVisible)"
>
</dx-load-panel>
