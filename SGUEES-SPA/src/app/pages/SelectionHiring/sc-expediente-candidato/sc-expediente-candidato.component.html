<div class="sguees-mtto-view">
  <!-- Barra estándar mtto (nuevo / guardar / cancelar / consultar). -->
  <app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [showRibbon]="true"
    [showExport]="permitePrint"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [permiteAdd]="permiteAdd"
    [showRefresh]="true"
    (consultar)="consultar()"
    (nuevo)="nuevo()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
  >
  </app-barra-data-mtto>

  <!-- Formulario del encabezado SC_EXPEDIENTE_CANDIDATO (solo en modo ítem). -->
  <div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">

    <div class="solicitud-header">
      <div class="solicitud-header__title">
          <i class="dx-icon dx-icon-group"></i>
          <h5>Datos Expediente</h5>
      </div>
    </div>

    <dx-form
      class="mt-20"
      #fData
      id="fData"
      [formData]="model"
      [labelLocation]="'top'"
      [colCount]="mttoFormColCount"
      [colCountByScreen]="mttoFormColCountByScreen"
      [showRequiredMark]="false"
      [items]="items"
    >
    </dx-form>

    <!--
      Grid hijo: Solicitudes Relacionadas (SC_EXPEDIENTE_SOLICITUD).
      Misma estructura que Bitácora Solicitud en sc-solicitud-empleo:
      contenedor .dx-grid-deta + [columns] + toolbar/search/paging/editing solo lectura.
    -->
    <div class="mt-24" *ngIf="(model?.CORR_EXPEDIENTE_CANDIDATO ?? 0) > 0">
          <div class="solicitud-header">
      <div class="solicitud-header__title">
          <i class="dx-icon dx-icon-bookmark"></i>
          <h5>Solicitudes Asociadas</h5>
      </div>
    </div>
      <div class="dx-grid-deta">
        <dx-data-grid
          #gridSolicitudes
          [dataSource]="solicitudes"
          [columns]="solicitudColumns"
          [keyExpr]="'CORR_EXPEDIENTE_SOLICITUD'"
          [showBorders]="true"
          [showColumnLines]="true"
          [showRowLines]="true"
          [rowAlternationEnabled]="true"
          [hoverStateEnabled]="true"
          [allowColumnResizing]="true"
          [columnResizingMode]="'widget'"
          [columnAutoWidth]="true"
          [height]="'100%'"
          [width]="'100%'"
          [noDataText]="'No hay solicitudes relacionadas a este expediente.'"
        >
          <dxo-toolbar>
            <dxi-item name="searchPanel" location="after"></dxi-item>
          </dxo-toolbar>

          <dxo-search-panel [visible]="true"></dxo-search-panel>

          <dxo-paging [pageSize]="5"></dxo-paging>

          <dxo-pager
            [showPageSizeSelector]="true"
            [allowedPageSizes]="[5, 10, 20]"
          ></dxo-pager>

          <!-- Solo lectura: el alta de vínculo se hace desde sc-solicitud-empleo (Asociar Expediente). -->
          <dxo-editing
            [allowUpdating]="false"
            [allowDeleting]="false"
            [allowAdding]="false"
          ></dxo-editing>
        </dx-data-grid>
      </div>
    </div>
  </div>

  <!-- Grid principal del catálogo (browse). -->
  <app-data-grid-mtto
    [isBrowse]="isBrowse()"
    [models]="models"
    [columns]="columns"
    [summary]="summary"
    [keyExpr]="mttoGridKeyExpr"
    [pageSize]="mttoPageSize"
    [allowedPageSizes]="mttoPageSizes"
    [remoteOperations]="mttoRemoteOperations"
    [repaintChangesOnly]="false"
    [nativeToolbar]="true"
    [unifiedToolbar]="false"
    [showSearch]="false"
    [showAdd]="false"
    [showRefresh]="false"
    [showExport]="false"
    [focusedRowKey]="gridFocusedRowKey"
    [permitePrint]="permitePrint"
    [permiteEditar]="getPermiteEditar"
    [permiteDele]="getPermiteDele"
    [responsiveColumnHiding]="false"
    [columnHidingEnabled]="false"
    [exportFileName]="'ExpedienteCandidato'"
    (rowDblClick)="rowDblClick($event)"
    (rowRemoving)="rowRemoving($event)"
    (focusedRowChanged)="focusedRowChanged($event)"
    (editClick)="onEditClick($event)"
  >
  </app-data-grid-mtto>
</div>

<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  (onShown)="(loadingVisible)"
>
</dx-load-panel>
