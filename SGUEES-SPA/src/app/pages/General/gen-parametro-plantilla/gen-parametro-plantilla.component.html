<!-- motivo: contenedor principal del mantenimiento de Plantillas de Correo -->
<div class="sguees-mtto-view">
	<!-- motivo: barra de herramientas superior para operaciones de browse y formulario -->
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[showRibbon]="true"
		[showExport]="permitePrint"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="true"
		[showEstadoToolbar]="false"
		[focusedRow]="isBrowse() ? model : null"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
	>
	</app-barra-data-mtto>

	<!-- motivo: tarjeta de formulario para creación y edición de plantilla con editor y versiones -->
	<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
		<!-- motivo: barra de versiones y acciones de historial visible si ya existe una versión guardada -->
		<div class="plantilla-toolbar-container" *ngIf="tienePrimeraVersionGuardada() || (!tieneModuloYProcesoFijado() && !cargandoVersiones)">
			<div class="version-alert-banner" style="background-color: #eff6ff; border-color: #3b82f6; color: #1e40af; width: 100%; margin: 0;" *ngIf="!tieneModuloYProcesoFijado() && !cargandoVersiones">
				<i class="dx-icon-info" style="color: #2563eb;"></i>
				<span>
					Guarde la información principal para fijar el módulo y habilitar la redacción del correo en el editor.
				</span>
			</div>

			<dx-button
				*ngIf="tienePrimeraVersionGuardada()"
				text="Nueva Versión"
				icon="add"
				type="default"
				(onClick)="abrirModalNuevaVersion()"
			></dx-button>

			<dx-button
				*ngIf="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
				text="Establecer como Activa"
				icon="check"
				type="warning"
				[disabled]="activandoVersion"
				(onClick)="activarVersionSeleccionada()"
			></dx-button>

			<div class="version-selector-wrapper" *ngIf="tienePrimeraVersionGuardada()">
				<span class="version-selector-label">Versión:</span>
				<dx-select-box
					class="version-select-box"
					[items]="versiones"
					[value]="versionSeleccionada?.NUMERO_VERSION"
					valueExpr="NUMERO_VERSION"
					[displayExpr]="formatVersionDisplay"
					(onValueChanged)="onVersionSelectionChange($event)"
				></dx-select-box>

				<span
					class="version-status-badge"
					[ngClass]="esVersionActivaSeleccionada() ? 'version-badge-activa' : 'version-badge-historica'"
				>
					<i [class]="esVersionActivaSeleccionada() ? 'dx-icon-check' : 'dx-icon-clock'"></i>
					{{ esVersionActivaSeleccionada() ? 'Versión Activa' : 'Versión Histórica' }}
				</span>
			</div>
		</div>

		<!-- motivo: formulario adaptable de cabecera de plantilla -->
		<div class="plantilla-form-container">
			<div class="plantilla-form-grid">
				<!-- motivo: selector de cuenta SMTP / remitente que usará la plantilla -->
				<div class="form-col form-col-medio">
					<label class="form-label">Servidor / Cuenta Remitente *</label>
					<dx-select-box
						[(value)]="model.CORR_PARAMETRO_SMTP"
						[items]="mSMTPS"
						valueExpr="Key"
						displayExpr="Value"
						[searchEnabled]="true"
						searchMode="contains"
						searchExpr="Value"
						[searchTimeout]="200"
						[showClearButton]="true"
						[dropDownOptions]="smtpDropDownOptions"
						(onOpened)="onSmtpOpened($event)"
						[readOnly]="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
						placeholder="Seleccione o escriba para buscar cuenta SMTP..."
					></dx-select-box>
				</div>

				<div class="form-col form-col-codigo">
					<label class="form-label">Código Plantilla *</label>
					<dx-text-box
						[(value)]="model.CODIGO_PLANTILLA"
						[maxLength]="50"
						[readOnly]="tieneModuloYProcesoFijado()"
						placeholder="Ej. BIENVENIDA_DOCENTE"
					></dx-text-box>
				</div>

				<div class="form-col form-col-nombre">
					<label class="form-label">Nombre de Plantilla *</label>
					<dx-text-box
						[(value)]="model.NOMBRE_PLANTILLA"
						[maxLength]="150"
						[readOnly]="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
						placeholder="Ej. Plantilla de Bienvenida a Nuevos Docentes"
					></dx-text-box>
				</div>

				<div class="form-col form-col-activo">
					<dx-check-box
						[(value)]="model.ACTIVO_PLANTILLA"
						[readOnly]="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
						text="Plantilla Activa"
					></dx-check-box>
				</div>

				<div class="form-col form-col-full">
					<label class="form-label">Asunto del Correo *</label>
					<dx-text-box
						[(value)]="model.ASUNTO_PLANTILLA"
						[maxLength]="255"
						[readOnly]="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
						placeholder="Ej. Bienvenido a la Universidad Evangélica de El Salvador"
					></dx-text-box>
				</div>

				<div class="form-col form-col-medio">
					<label class="form-label">Con Copia (CC)</label>
					<dx-text-box
						[(value)]="model.CORREO_CC"
						[maxLength]="255"
						[readOnly]="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
						placeholder="correo1@uees.edu.sv, correo2@uees.edu.sv"
					></dx-text-box>
				</div>

				<div class="form-col form-col-medio">
					<label class="form-label">Con Copia Oculta (CCO)</label>
					<dx-text-box
						[(value)]="model.CORREO_CCO"
						[maxLength]="255"
						[readOnly]="tienePrimeraVersionGuardada() && !esVersionActivaSeleccionada()"
						placeholder="auditoria@uees.edu.sv"
					></dx-text-box>
				</div>

				<div class="form-col form-col-medio">
					<label class="form-label">Módulo *</label>
					<dx-select-box
						[(value)]="model.CODIGO_SISTEMA"
						[items]="mSISTEMAS"
						valueExpr="Key"
						displayExpr="Value"
						[searchEnabled]="true"
						[readOnly]="tieneModuloYProcesoFijado()"
						placeholder="Seleccione el módulo..."
						(onValueChanged)="onModuloChange($event)"
					></dx-select-box>
				</div>

				<div class="form-col form-col-medio">
					<label class="form-label">Menú / Proceso *</label>
					<dx-select-box
						[(value)]="model.CODIGO_OPCION"
						[items]="mOPCIONES"
						valueExpr="Key"
						displayExpr="Value"
						[searchEnabled]="true"
						[readOnly]="tieneModuloYProcesoFijado()"
						[disabled]="!model.CODIGO_SISTEMA"
						placeholder="Seleccione el menú o proceso..."
						(onValueChanged)="onOpcionChange($event)"
					></dx-select-box>
				</div>

				<!-- motivo: editor enriquecido institucional y parámetros dinámicos -->
				<div class="form-col form-col-full form-col-editor">
					<div class="plantilla-editor-header">
						<label class="form-label" style="font-weight: 600; font-size: 13px; color: #475569; margin: 0;">
							Correo *
						</label>
						<div class="plantilla-editor-actions">
							<dx-button
								text="Formato Institucional"
								icon="email"
								type="normal"
								stylingMode="outlined"
								[height]="30"
								[disabled]="!esEditorHabilitado()"
								(onClick)="cargarFormatoBaseUEES()"
							></dx-button>
							<dx-button
								text="Limpiar Editor"
								icon="trash"
								type="normal"
								stylingMode="outlined"
								[height]="30"
								[disabled]="!esEditorHabilitado()"
								(onClick)="limpiarEditor()"
							></dx-button>
						</div>
					</div>
					<div class="plantilla-editor-wrapper">
						<app-text-editor
							[(value)]="model.CUERPO_PLANTILLA"
							[parametros]="parametrosDisponibles"
							[height]="500"
							[readOnly]="!esEditorHabilitado()"
							[placeholder]="tieneModuloYProcesoFijado() ? 'Escriba el contenido del correo...' : 'Guarde la información principal para habilitar la redacción del correo...'"
						></app-text-editor>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- motivo: grilla browse principal con el listado general de plantillas registradas -->
	<app-data-grid-mtto
		*ngIf="isBrowse()"
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[repaintChangesOnly]="false"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[showEstadoToolbar]="false"
		[focusedRowKey]="gridFocusedRowKey"
		[permitePrint]="permitePrint"
		[permiteEditar]="getPermiteEditar"
		[permiteDele]="getPermiteDele"
		[wordWrapEnabled]="true"
		(rowDblClick)="rowDblClick($event)"
		(editClick)="onEditClick($event)"
		(rowRemoving)="rowRemoving($event)"
		(focusedRowChanged)="focusedRowChanged($event)"
	>
	</app-data-grid-mtto>

	<!-- motivo: modal para crear una nueva versión de plantilla -->
	<dx-popup
		[visible]="popupNuevaVersionVisible"
		[showTitle]="true"
		title="Nueva Versión de Plantilla"
		[width]="520"
		[maxWidth]="'calc(100vw - 24px)'"
		[height]="'auto'"
		[dragEnabled]="false"
		[closeOnOutsideClick]="false"
		(onHiding)="cerrarModalNuevaVersion()"
	>
		<div *dxTemplate="let data of 'content'" style="padding: 10px 0;">
			<p style="font-size: 13px; color: #64748b; margin-bottom: 14px; line-height: 1.5;">
				Se creará una nueva versión con el contenido, asunto y correos actuales. Ingrese el motivo del cambio:
			</p>
			<div style="margin-bottom: 16px;">
				<label class="form-label" style="font-weight: 600; font-size: 13px; color: #334155; margin-bottom: 6px; display: block;">
					Motivo del cambio *
				</label>
				<dx-text-area
					[(value)]="motivoNuevaVersion"
					[maxLength]="255"
					[height]="90"
					placeholder="Ej. Actualización del pie de firma institucional y enlaces..."
				></dx-text-area>
			</div>
			<div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
				<dx-button text="Cancelar" icon="close" type="normal" (onClick)="cerrarModalNuevaVersion()"></dx-button>
				<dx-button text="Crear Versión" icon="check" type="success" [disabled]="guardandoNuevaVersion" (onClick)="confirmarNuevaVersion()"></dx-button>
			</div>
		</div>
	</dx-popup>
</div>
