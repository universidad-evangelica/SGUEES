<!-- Mantenimiento de gerencias: barra, formulario con lookup de división y grid -->
<div class="sguees-mtto-view">
	<!-- Acciones Nuevo / Guardar / Cancelar / Exportar / Refresh en ribbon (como estructura territorial) -->
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[subTituloVentana]="subTituloVentana"
		[showRibbon]="true"
		[showExport]="permitePrint"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="true"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
	>
	</app-barra-data-mtto>

	<!-- Formulario de creación/edición; el lookup de división usa plantilla custom -->
	<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
		<dx-form
			#fData
			id="fData"
			[formData]="model"
			[labelLocation]="'top'"
			[colCount]="mttoFormColCount"
			[colCountByScreen]="mttoFormColCountByScreen"
			[showRequiredMark]="false"
			[items]="items"
		>
			<!-- Selector de división; marca visual si falta selección al guardar -->
			<div *dxTemplate="let cellInfo of 'CORR_DIVISIONLookup'">
				<div class="division-lookup-field" [class.division-lookup-field--invalid]="divisionInvalida">
					<app-data-lookup
						[model]="mCORR_DIVISION"
						[value]="model.CORR_DIVISION"
						(valueChange)="onDivisionChanged($event)"
						[valueExpr]="'CORR_DIVISION'"
						[displayExpr]="'NOMBRE_DIVISION'"
						[selectedRowKeys]="selectedLookUpCORR_DIVISION"
						[readOnly]="readOnly"
					>
					</app-data-lookup>
				</div>
			</div>
		</dx-form>
	</div>

	<!-- Listado de gerencias con paginación local -->
	<app-data-grid-mtto
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[repaintChangesOnly]="false"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[permitePrint]="permitePrint"
		[permiteEditar]="getPermiteEditar"
		[permiteDele]="getPermiteDele"
		[responsiveColumnHiding]="false"
		[columnHidingEnabled]="false"
		[exportFileName]="'Gerencias'"
		(rowDblClick)="rowDblClick($event)"
		(rowRemoving)="rowRemoving($event)"
		(focusedRowChanged)="focusedRowChanged($event)"
		(editClick)="onEditClick($event)"
	>
	</app-data-grid-mtto>
</div>

<!-- Overlay de carga durante operaciones al API -->
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
