<div class="sguees-mtto-view">
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[showRibbon]="true"
		[showExport]="permitePrint"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="!vistaDetalle"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
	>
	</app-barra-data-mtto>

	<!-- Lista de países (entrada al módulo) -->
	<ng-container *ngIf="!vistaDetalle">
		<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
			<dx-form
				#fData
				id="fData"
				[formData]="model"
				[labelLocation]="'top'"
				[colCount]="mttoFormColCount"
				[colCountByScreen]="mttoFormColCountByScreen"
				[showRequiredMark]="false"
				[items]="items"
			>
			</dx-form>
		</div>

		<app-data-grid-mtto
			#paisGrid
			[isBrowse]="isBrowse()"
			[models]="models"
			[columns]="columns"
			[summary]="summary"
			[keyExpr]="mttoGridKeyExpr"
			[remoteOperations]="mttoRemoteOperations"
			[pageSize]="mttoPageSize"
			[allowedPageSizes]="mttoPageSizes"
			[nativeToolbar]="true"
			[unifiedToolbar]="false"
			[showSearch]="false"
			[showAdd]="false"
			[showRefresh]="false"
			[showExport]="false"
			[permitePrint]="permitePrint"
			[permiteEditar]="getPermiteEditar"
			[permiteDele]="getPermiteDele"
			[responsiveColumnHiding]="false"
			[columnHidingEnabled]="false"
			[exportFileName]="'Paises'"
			(editClick)="editarPaisDesdeGrid($event)"
			(rowDblClick)="rowDblClick($event)"
			(rowRemoving)="rowRemoving($event)"
		></app-data-grid-mtto>
	</ng-container>

	<!-- Documento país + cascada (flujo tipo partida: Guardar / Cancelar del padre) -->
	<ng-container *ngIf="vistaDetalle">
		<div class="content-block dx-card responsive-paddings sguees-mtto-form-card territorial-form-card">
			<dx-form
				#fData
				id="fData"
				[formData]="model"
				[labelLocation]="'top'"
				[colCount]="mttoFormColCount"
				[colCountByScreen]="mttoFormColCountByScreen"
				[showRequiredMark]="false"
				[items]="items"
			>
			</dx-form>
		</div>

		<div class="territorial-cascade" *ngIf="selectedPais">
			<div class="territorial-panels" [style.--territorial-cascade-grid-height.px]="cascadeGridHeight">
						<div class="territorial-panel territorial-panel--cascade">
							<app-data-grid-mtto
								#deptoGrid
								[isBrowse]="true"
								[models]="deptoModels"
								[columns]="deptoColumns"
								[summary]="deptoSummary"
								[keyExpr]="'CORR_DEPTO'"
								[remoteOperations]="cascadeRemoteOperations"
								[headerFilterLoader]="loadHeaderFilterValuesDeptos"
								[gridHeight]="cascadeGridHeight"
								[repaintChangesOnly]="false"
								[unifiedToolbar]="true"
								[showSearch]="false"
								[showAdd]="true"
								[showRefresh]="true"
								[showExport]="false"
								[permitePrint]="false"
								[responsiveColumnHiding]="false"
								[columnHidingEnabled]="false"
								[titulo]="'Departamentos'"
								[subtitle]="selectedPais?.NOMBRE_PAIS || ''"
								(refresh)="refrescarDeptos()"
								(add)="nuevoDepto()"
								(rowClick)="onDeptoFocused($event)"
								(focusedRowChanged)="onDeptoFocused($event)"
							></app-data-grid-mtto>
						</div>

						<div class="territorial-panel territorial-panel--cascade" [class.territorial-panel--disabled]="!selectedDepto">
							<app-data-grid-mtto
								#municipioGrid
								[isBrowse]="true"
								[models]="municipioModels"
								[columns]="municipioColumns"
								[summary]="municipioSummary"
								[keyExpr]="'CORR_MUNICIPIO'"
								[remoteOperations]="cascadeRemoteOperations"
								[headerFilterLoader]="loadHeaderFilterValuesMunicipios"
								[gridHeight]="cascadeGridHeight"
								[repaintChangesOnly]="false"
								[unifiedToolbar]="true"
								[showSearch]="false"
								[showAdd]="!!selectedDepto"
								[showRefresh]="true"
								[showExport]="false"
								[permitePrint]="false"
								[responsiveColumnHiding]="false"
								[columnHidingEnabled]="false"
								[titulo]="'Municipios'"
								[subtitle]="selectedDepto?.NOMBRE_DEPTO || ''"
								(refresh)="refrescarMunicipios()"
								(add)="nuevoMunicipio()"
								(rowClick)="onMunicipioFocused($event)"
								(focusedRowChanged)="onMunicipioFocused($event)"
							></app-data-grid-mtto>
						</div>

						<div class="territorial-panel territorial-panel--cascade" [class.territorial-panel--disabled]="!selectedMunicipio">
							<app-data-grid-mtto
								#distritoGrid
								[isBrowse]="true"
								[models]="distritoModels"
								[columns]="districtoColumns"
								[summary]="distritoSummary"
								[keyExpr]="'CORR_DISTRITO'"
								[remoteOperations]="cascadeRemoteOperations"
								[headerFilterLoader]="loadHeaderFilterValuesDistritos"
								[gridHeight]="cascadeGridHeight"
								[repaintChangesOnly]="false"
								[unifiedToolbar]="true"
								[showSearch]="false"
								[showAdd]="!!selectedMunicipio"
								[showRefresh]="true"
								[showExport]="false"
								[permitePrint]="false"
								[responsiveColumnHiding]="false"
								[columnHidingEnabled]="false"
								[titulo]="'Distritos'"
								[subtitle]="selectedMunicipio?.NOMBRE_MUNICIPIO || ''"
								(refresh)="refrescarDistritos()"
								(add)="nuevoDistrito()"
							></app-data-grid-mtto>
						</div>
			</div>
		</div>
	</ng-container>
</div>

<dx-popup
	[(visible)]="popupVisible"
	[showTitle]="true"
	[title]="popupTitle"
	[width]="popupWidth"
	[maxWidth]="'calc(100vw - 24px)'"
	[height]="'auto'"
	[showCloseButton]="true"
	[dragEnabled]="false"
	[wrapperAttr]="{ class: 'territorial-crud-popup' }"
>
	<div class="territorial-popup-body">
		<dx-form
			#popupForm
			[formData]="popupModel"
			[labelLocation]="'top'"
			[colCount]="2"
			[colCountByScreen]="popupFormColCountByScreen"
			[showRequiredMark]="false"
			[items]="popupItems"
		></dx-form>
		<div class="territorial-popup-actions">
			<dx-button text="Guardar" type="default" stylingMode="contained" (onClick)="guardarPopup()"></dx-button>
			<dx-button text="Cancelar" stylingMode="outlined" (onClick)="cerrarPopup()"></dx-button>
		</div>
	</div>
</dx-popup>

<dx-load-panel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
