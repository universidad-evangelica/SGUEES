<!-- Mantenimiento de divisiones: barra, formulario y grid -->
<div class="sguees-mtto-view">
	<!-- Acciones Nuevo / Guardar / Cancelar / Exportar / Refresh en ribbon (como estructura territorial) -->
	<app-barra-data-mtto
		[tituloVentana]="tituloVentana"
		[showRibbon]="true"
		[showExport]="permitePrint"
		[isBrowse]="isBrowse()"
		[isForm]="isForm()"
		[permiteAdd]="permiteAdd"
		[showRefresh]="true"
		(consultar)="consultar()"
		(nuevo)="nuevo()"
		(guardar)="guardar()"
		(cancelar)="cancelar()"
	>
	</app-barra-data-mtto>

	<!-- Formulario de creación/edición (oculto en modo browse) -->
	<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
		<dx-form
			#fData
			id="fData"
			[formData]="model"
			[labelLocation]="'top'"
			[colCount]="mttoFormColCount"
			[colCountByScreen]="mttoFormColCountByScreen"
			[showRequiredMark]="false"
			[items]="items"
		>
		</dx-form>
	</div>

	<!-- Listado de divisiones con paginación local -->
	<app-data-grid-mtto
		[isBrowse]="isBrowse()"
		[models]="models"
		[columns]="columns"
		[summary]="summary"
		[keyExpr]="mttoGridKeyExpr"
		[pageSize]="mttoPageSize"
		[allowedPageSizes]="mttoPageSizes"
		[remoteOperations]="mttoRemoteOperations"
		[repaintChangesOnly]="false"
		[nativeToolbar]="true"
		[unifiedToolbar]="false"
		[showSearch]="false"
		[showAdd]="false"
		[showRefresh]="false"
		[showExport]="false"
		[permitePrint]="permitePrint"
		[permiteEditar]="getPermiteEditar"
		[permiteDele]="getPermiteDele"
		[responsiveColumnHiding]="false"
		[columnHidingEnabled]="false"
		[exportFileName]="'Divisiones'"
		(rowDblClick)="rowDblClick($event)"
		(rowRemoving)="rowRemoving($event)"
		(focusedRowChanged)="focusedRowChanged($event)"
		(editClick)="onEditClick($event)"
	>
	</app-data-grid-mtto>
</div>

<!-- Overlay de carga durante operaciones al API -->
<dx-load-panel
	#loadPanel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
