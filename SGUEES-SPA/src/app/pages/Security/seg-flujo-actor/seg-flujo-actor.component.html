<!-- Barra de herramientas principal -->
<app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [showExport]="permitePrint"
    [showRibbon]="true"
    [showRefresh]="true"
	[showEstadoToolbar]="true"
    [permiteAdd]="permiteAdd"
    (nuevo)="nuevo()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
>
</app-barra-data-mtto>

<!-- ================================================ -->
<!-- PANTALLA DE EDICIÓN / CREACIÓN (SOLO !isBrowse) -->
<!-- ================================================ -->
<div *ngIf="!isBrowse()" class="actor-edit-shell">

    <!-- SECCIÓN 1: Formulario del Actor -->
    <section class="sguees-section-card actor-form-card">
        <header class="seg-flujo-actor-section-head">
            <span class="seg-flujo-actor-section-title">Datos del Actor</span>
            <span class="seg-flujo-actor-section-subtitle">Información general del actor de flujo</span>
        </header>
        <dx-form #fData id="fData" [formData]="model" [labelLocation]="'top'" [colCount]="8" [items]="items">
        </dx-form>
    </section>

    <!-- SECCIÓN 2: Gestión de Asignaciones (SOLO si existe el actor) -->
    <section class="sguees-section-card seg-flujo-actor-asignaciones-card" *ngIf="model && model.CORR_ACTOR > 0">
        <header class="seg-flujo-actor-section-head">
            <span class="seg-flujo-actor-section-title">Asignaciones del Actor</span>
            <span class="seg-flujo-actor-section-subtitle">Usuarios asignados al actor {{ model.NOMBRE_ACTOR }}</span>
        </header>

        <!-- Barra de herramientas de Asignaciones -->
        <app-barra-data-mtto
            [isBrowse]="isAsignacionBrowse()"
            [isForm]="isAsignacionForm()"
            [permiteAdd]="getPermiteAddAsignacion"
            (nuevo)="nuevoAsignacion()"
            (guardar)="guardarAsignacion()"
            (cancelar)="cancelarAsignacion()"
        >
        </app-barra-data-mtto>

        <!-- Formulario de Asignación (se muestra cuando NO está en browse) -->
        <div *ngIf="!isAsignacionBrowse()" style="margin-top: 15px;">
            <dx-form #fDataAsignacion id="fDataAsignacion" [formData]="asignacionModel" [labelLocation]="'top'" [colCount]="8" [items]="asignacionItems">
                <div *dxTemplate="let cellInfo of 'CORR_UNIDADTemplate'">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <dx-select-box
                            [dataSource]="unidades"
                            [(value)]="asignacionModel.CORR_UNIDAD"
                            displayExpr="NOMBRE_UNIDAD_TREE"
                            valueExpr="CORR_UNIDAD"
                            placeholder="Seleccionar unidad..."
                            [showClearButton]="true"
                            [searchEnabled]="true"
                            [searchTimeout]="200"
                            (onValueChanged)="onFiltroUnidadEmpleadoChanged($event.value)"
                            style="width: 250px;"
                        >
                        </dx-select-box>

                        <app-data-lookup
                            [model]="empleadosDisponibles"
                            [(value)]="asignacionModel.LOGIN_SISTEMA"
                            [valueExpr]="'LOGIN_SISTEMA_WEB'"
                            [displayExpr]="'NOMBRE_EMPLEADO'"
                            [lookupColumns]="[
                                { dataField: 'NOMBRE_EMPLEADO', caption: 'Empleado', width: 200 },
                                { dataField: 'LOGIN_SISTEMA_WEB', caption: 'Login', width: 200 },
                                { dataField: 'UNIDAD_EMPLEADO', caption: 'Unidad', width: 200 }
                            ]"
                            [selectedRowKeys]="selectedLookUpLOGIN_SISTEMA"
                            [readOnly]="asignacionReadOnly"
                            style="flex: 1;"
                        >
                        </app-data-lookup>
                    </div>
                </div>
            </dx-form>
        </div>

        <!-- Grid de Asignaciones (siempre visible) -->
        <div >
            <app-data-grid-mtto
                [isBrowse]="isAsignacionBrowse()"
                [models]="asignacionModels"
                [columns]="asignacionColumns"
                [keyExpr]="'CORR_ASIGNACION'"
                [permiteEditar]="getPermiteEditarAsignacion"
                [permiteDele]="getPermiteDeleAsignacion"
                (rowDblClick)="rowDblClickAsignacion($event)"
                (rowRemoving)="rowRemovingAsignacion($event)"
                (editClick)="editarAsignacion($event)"
            >
            </app-data-grid-mtto>
        </div>
    </section>

</div>

<!-- ================================================ -->
<!-- GRID PRINCIPAL (siempre visible) -->
<!-- ================================================ -->
<app-data-grid-mtto
    [isBrowse]="isBrowse()"
    [models]="models"
    [columns]="columns"
    [summary]="summary"
    [keyExpr]="'CORR_ACTOR'"
    [unifiedToolbar]="false"
    [showAdd]="false"
    [showSearch]="false"
    [showExport]="false"
    [showRefresh]="false"
    [permiteEditar]="getPermiteEditar"
    [permiteDele]="getPermiteDele"
    (rowDblClick)="rowDblClick($event)"
    (rowRemoving)="rowRemoving($event)"
    (focusedRowChanged)="focusedRowChanged($event)"
    (editClick)="editarClick($event)"
>
</app-data-grid-mtto>

<dx-load-panel
    #loadPanel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
    [(visible)]="loadingVisible"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
    (onShown)="(loadingVisible)"
>
</dx-load-panel>
