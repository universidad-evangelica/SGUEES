<!-- Qué hace: pantalla del tipo de documento. La barra global vive solo en este encabezado. -->
<div class="sguees-mtto-view">
<!-- Qué hace: barra con pestaña Principal, igual que el descriptor. -->
<app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [showRibbon]="true"
    [showExport]="permitePrint"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [permiteAdd]="permiteAdd"
    [showRefresh]="true"
    (nuevo)="nuevo()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
    (consultar)="consultar()"
>
</app-barra-data-mtto>

<!-- Qué hace: formulario del tipo de documento. Guardar y Cancelar están en la barra de arriba. -->
<div class="content-block dx-card responsive-paddings" *ngIf="isForm()">
    <dx-form #fData id="fData" [formData]="model" [labelLocation]="'top'" [colCount]="8" [items]="items">
    </dx-form>
</div>

<!-- Qué hace: estados del tipo de documento abierto. Sus botones no usan la barra global. -->
<section class="sguees-section-card tipo-documento-estados-card" *ngIf="isForm() && model && model.CORR_TIPO_DOCUMENTO > 0">
    <header class="tipo-documento-section-head">
        <span class="tipo-documento-section-title">Estados del Documento</span>
        <span class="tipo-documento-section-subtitle">Estados asociados al tipo de documento {{ model.NOMBRE_TIPO }}</span>
    </header>

    <!-- Qué hace: Nuevo, Guardar y Cancelar del estado, sin la barra de mantenimiento. -->
    <div class="tipo-documento-estados-toolbar" *ngIf="(isEstadoBrowse() && getPermiteAddEstado) || !isEstadoBrowse()">
        <dx-button
            *ngIf="isEstadoBrowse() && getPermiteAddEstado"
            class="tipo-documento-estados-toolbar-btn"
            icon="plus"
            text="Nuevo"
            type="success"
            stylingMode="contained"
            (onClick)="nuevoEstado()"
        ></dx-button>
        <dx-button
            *ngIf="!isEstadoBrowse()"
            class="tipo-documento-estados-toolbar-btn"
            icon="save"
            text="Guardar"
            type="success"
            stylingMode="contained"
            (onClick)="guardarEstado()"
        ></dx-button>
        <dx-button
            *ngIf="!isEstadoBrowse()"
            class="tipo-documento-estados-toolbar-btn"
            icon="close"
            text="Cancelar"
            type="danger"
            stylingMode="contained"
            (onClick)="cancelarEstado()"
        ></dx-button>
    </div>

    <div *ngIf="!isEstadoBrowse()">
        <dx-form #fDataEstado id="fDataEstado" [formData]="estadoModel" [labelLocation]="'top'" [colCount]="8" [items]="estadoItems">
        </dx-form>
    </div>

    <!-- Qué hace: lista los estados que ya devolvió la consulta del tipo de documento. -->
    <!-- Cómo lo hace: grilla normal, la de mantenimiento dejaba el paginador en -1 y no pintaba las filas. -->
    <dx-data-grid
        *ngIf="isEstadoBrowse()"
        class="theme-dependent sguees-data-grid-mtto"
        [dataSource]="estadoModels"
        keyExpr="CORR_ESTADO"
        [columnAutoWidth]="false"
        [showBorders]="true"
        [showColumnLines]="true"
        [showRowLines]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [allowColumnResizing]="true"
        [columnResizingMode]="'widget'"
        [width]="'100%'"
        noDataText="Sin estados."
        (onRowDblClick)="rowDblClickEstado($event)"
    >
        <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
        <dxo-pager [visible]="true" [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 25]" [showInfo]="true"></dxo-pager>
        <dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
        <dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
        <dxo-load-panel [enabled]="false"></dxo-load-panel>
        <dxi-column caption="" [width]="90" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesEstadoTpl" alignment="center"></dxi-column>
        <div *dxTemplate="let cell of 'accionesEstadoTpl'">
            <dx-button *ngIf="permiteEdit" icon="edit" stylingMode="text" hint="Editar" (onClick)="editarEstado(cell.data)"></dx-button>
            <dx-button *ngIf="permiteDele" icon="trash" stylingMode="text" hint="Eliminar" (onClick)="pedirEliminarEstado(cell.data)"></dx-button>
        </div>
        <dxi-column dataField="CORR_ESTADO" caption="Corr." [width]="90" dataType="number"></dxi-column>
        <dxi-column dataField="NOMBRE_ESTADO" caption="Nombre" [width]="250" [minWidth]="180"></dxi-column>
        <dxi-column dataField="DESCRIPCION" caption="Descripción" [width]="360" [minWidth]="200"></dxi-column>
        <dxi-column dataField="ES_INICIAL" caption="Inicial" [width]="110" alignment="center" cellTemplate="siNoEstadoTpl"></dxi-column>
        <dxi-column dataField="ES_FINAL" caption="Final" [width]="110" alignment="center" cellTemplate="siNoEstadoTpl"></dxi-column>
        <dxi-column dataField="ACTIVO" caption="Activo" [width]="100" alignment="center" cellTemplate="siNoEstadoTpl"></dxi-column>
        <div *dxTemplate="let cell of 'siNoEstadoTpl'">
            {{ cell.value ? 'Sí' : 'No' }}
        </div>
    </dx-data-grid>
</section>

<!-- Qué hace: listado de tipos de documento mientras no se está editando. -->
<!-- Qué hace: listado. La barra de arriba es la del ribbon; esta grilla no arma otra. -->
<app-data-grid-mtto
    [isBrowse]="isBrowse()"
    [models]="models"
    [columns]="columns"
    [summary]="summary"
    [keyExpr]="'CORR_TIPO_DOCUMENTO'"
    [nativeToolbar]="true"
    [unifiedToolbar]="false"
    [showAdd]="false"
    [showSearch]="false"
    [showExport]="false"
    [showRefresh]="false"
    [permiteEditar]="getPermiteEditar"
    [permiteDele]="getPermiteDele"
    (rowDblClick)="rowDblClick($event)"
    (rowRemoving)="rowRemoving($event)"
    (focusedRowChanged)="focusedRowChanged($event)"
    (editClick)="editarClick($event)"
>
</app-data-grid-mtto>

<dx-load-panel
    #loadPanel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
    [(visible)]="loadingVisible"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
>
</dx-load-panel>
</div>
