<div class="sguees-mtto-view">
<app-barra-data-mtto
	[tituloVentana]="tituloVentana"
	[isBrowse]="isBrowse()"
	[isForm]="isForm()"
	[showRibbon]="true"
	[permiteAdd]="permiteAdd"
	[showRefresh]="true"
	[showExport]="permitePrint"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
	(consultar)="consultar()"
>
</app-barra-data-mtto>

<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">
	<dx-form
		#fData
		id="fData"
		[formData]="model"
		[labelLocation]="'top'"
		[colCount]="mttoFormColCount"
		[colCountByScreen]="mttoFormColCountByScreen"
		[showRequiredMark]="false"
		[items]="items"
	>
		<div *dxTemplate="let cellInfo of 'CODIGO_SISTEMALookup'">
			<app-data-lookup
				[model]="mCODIGO_SISTEMA"
				[(value)]="model.CODIGO_SISTEMA"
				[selectedRowKeys]="selectedLookUpCODIGO_SISTEMA"
				[readOnly]="bloqLookups"
				[valueExpr]="'CODIGO_SISTEMA'"
				[displayExpr]="'NOMBRE_SISTEMA'"
				[lookupColumns]="sistemaLookupColumns"
			>
			</app-data-lookup>
		</div>
		<div *dxTemplate="let cellInfo of 'CODIGO_MENULookup'">
			<app-data-lookup
				[model]="mCODIGO_MENU"
				[(value)]="model.CODIGO_MENU"
				[selectedRowKeys]="selectedLookUpCODIGO_MENU"
				[readOnly]="bloqLookups"
				[valueExpr]="'CODIGO_MENU'"
				[displayExpr]="'NOMBRE_MENU'"
				[lookupColumns]="menuLookupColumns"
			>
			</app-data-lookup>
		</div>
		<div *dxTemplate="let cellInfo of 'CODIGO_OPCIONLookup'">
			<app-data-lookup
				[model]="mCODIGO_OPCION"
				[(value)]="model.CODIGO_OPCION"
				[selectedRowKeys]="selectedLookUpCODIGO_OPCION"
				[readOnly]="bloqLookups"
				[valueExpr]="'CODIGO_OPCION'"
				[displayExpr]="'NOMBRE_OPCION'"
				[lookupColumns]="opcionLookupColumns"
			>
			</app-data-lookup>
		</div>
	</dx-form>
</div>

<app-data-grid-mtto
	[isBrowse]="isBrowse()"
	[models]="models"
	[columns]="columns"
	[summary]="summary"
	[keyExpr]="gridKeyExpr"
	[pageSize]="mttoPageSize"
	[allowedPageSizes]="mttoPageSizes"
	[remoteOperations]="mttoRemoteOperations"
	[nativeToolbar]="true"
	[unifiedToolbar]="false"
	[showSearch]="false"
	[showAdd]="false"
	[showRefresh]="false"
	[showExport]="false"
	[permitePrint]="permitePrint"
	[permiteEditar]="getPermiteEditar"
	[permiteDele]="getPermiteDele"
	[responsiveColumnHiding]="false"
	[columnHidingEnabled]="false"
	[exportFileName]="'ConfigOpciones'"
	(rowDblClick)="rowDblClick($event)"
	(rowRemoving)="rowRemoving($event)"
	(focusedRowChanged)="focusedRowChanged($event)"
	(editClick)="editarClick($event)"
>
</app-data-grid-mtto>
</div>

<dx-load-panel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
>
</dx-load-panel>
