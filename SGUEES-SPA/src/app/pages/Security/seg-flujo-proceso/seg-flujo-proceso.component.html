<div class="sguees-mtto-view"> 
<!-- Qué hace: barra del flujo, con la pestaña Principal del descriptor. -->
<app-barra-data-mtto
    [tituloVentana]="tituloVentana"
    [showRibbon]="true"
    [isBrowse]="isBrowse()"
    [isForm]="isForm()"
    [permiteAdd]="permiteAdd"
    [showRefresh]="true"
    [showExport]="permitePrint"
    (nuevo)="nuevo()"
    (guardar)="guardar()"
    (cancelar)="cancelar()"
    (consultar)="consultar()"
>
</app-barra-data-mtto>

<div *ngIf="!isBrowse()" class="flujo-edit-shell">
	<!-- Qué hace: formulario del flujo. Guardar y Cancelar están en la barra de arriba. -->
	<div class="content-block dx-card responsive-paddings flujo-form-card">
		<dx-form
			#fData
			id="fData"
			class="sguees-form-premium"
			[formData]="model"
			[labelLocation]="'top'"
			[colCount]="8"
			[items]="items"
		>
			<div *dxTemplate="let cellInfo of 'CORR_TIPO_DOCUMENTOLookup'">
				<app-data-lookup
					[model]="mCORR_TIPO_DOCUMENTO"
					[(value)]="model.CORR_TIPO_DOCUMENTO"
					[valueExpr]="'CORR_TIPO_DOCUMENTO'"
					[displayExpr]="'NOMBRE_TIPO'"
					[selectedRowKeys]="selectedLookUpCORR_TIPO_DOCUMENTO"
					[readOnly]="readOnly"
				>
				</app-data-lookup>
			</div>
		</dx-form>
	</div>

	<section class="sguees-section-card flujo-detalle-card" *ngIf="model.CORR_FLUJO_PROCESO > 0">
		<dx-tab-panel #tabPanel class="flujo-tab-panel" [selectedIndex]="0">
			<dxi-item title="Pasos del Flujo" [icon]="'tasks'">
				<div class="flujo-paso-grid">
					<div class="flujo-paso-toolbar" *ngIf="(getPermiteAddPaso && isPasoBrowse()) || isPasoForm()">
						<dx-button
							*ngIf="getPermiteAddPaso && isPasoBrowse()"
							class="flujo-paso-toolbar-btn"
							icon="plus"
							text="Nuevo"
							type="default"
							stylingMode="contained"
							(onClick)="nuevoPaso()"
						></dx-button>
						<dx-button
							*ngIf="isPasoForm()"
							class="flujo-paso-toolbar-btn"
							icon="save"
							text="Guardar paso"
							type="success"
							stylingMode="contained"
							(onClick)="guardarPaso()"
						></dx-button>
						<dx-button
							*ngIf="isPasoForm()"
							class="flujo-paso-toolbar-btn flujo-paso-toolbar-btn--cancel"
							icon="revert"
							text="Cancelar"
							type="danger"
							stylingMode="contained"
							(onClick)="cancelarPaso()"
						></dx-button>
					</div>

					<div *ngIf="isPasoForm()">
						<dx-form
							#fPaso
							id="fPaso"
							class="sguees-form-premium"
							[formData]="pasoModel"
							[labelLocation]="'top'"
							[colCount]="8"
							[items]="itemsPasos"
						>
							<div *dxTemplate="let cellInfo of 'CORR_ACTOR_ORIGENLookup'">
								<app-data-lookup
									[model]="mCORR_ACTOR_ORIGEN"
									[(value)]="pasoModel.CORR_ACTOR_ORIGEN"
									[valueExpr]="'CORR_ACTOR'"
									[displayExpr]="'NOMBRE_ACTOR'"
									[selectedRowKeys]="selectedLookUpCORR_ACTOR_ORIGEN"
									[readOnly]="pasoReadOnly"
								>
								</app-data-lookup>
							</div>
							<div *dxTemplate="let cellInfo of 'CORR_ACTOR_DESTINOLookup'">
								<app-data-lookup
									[model]="mCORR_ACTOR_DESTINO"
									[(value)]="pasoModel.CORR_ACTOR_DESTINO"
									[valueExpr]="'CORR_ACTOR'"
									[displayExpr]="'NOMBRE_ACTOR'"
									[selectedRowKeys]="selectedLookUpCORR_ACTOR_DESTINO"
									[readOnly]="pasoReadOnly"
									(valueChange)="onActorDestinoChanged($event)"
								>
								</app-data-lookup>
							</div>
							<div *dxTemplate="let cellInfo of 'CORR_UNIDAD_DESTINOTemplate'">
								<div *ngIf="mostrarUnidadDestino; else unidadDestinoHint">
									<dx-select-box
										[dataSource]="unidadesPaso"
										[(value)]="pasoModel.CORR_UNIDAD_DESTINO"
										displayExpr="NOMBRE_UNIDAD_TREE"
										valueExpr="CORR_UNIDAD"
										placeholder="Seleccionar unidad destino..."
										[showClearButton]="true"
										[searchEnabled]="true"
										[searchTimeout]="200"
									>
									</dx-select-box>
								</div>
								<ng-template #unidadDestinoHint>
									<span class="flujo-unidad-hint">
										El actor seleccionado no requiere de unidad
									</span>
								</ng-template>
							</div>
							<div *dxTemplate="let cellInfo of 'CORR_ESTADO_ORIGENLookup'">
								<app-data-lookup
									*ngIf="mostrarEstadoOrigenPaso"
									[model]="mCORR_ESTADO_ORIGEN"
									[(value)]="pasoModel.CORR_ESTADO_ORIGEN"
									[valueExpr]="'CORR_ESTADO'"
									[displayExpr]="'NOMBRE_ESTADO'"
									[selectedRowKeys]="selectedLookUpCORR_ESTADO_ORIGEN"
									[readOnly]="pasoReadOnly"
								>
								</app-data-lookup>
							</div>
						</dx-form>
					</div>

					<!-- Qué hace: lista los pasos del flujo. -->
					<!-- Cómo lo hace: grilla normal, con editar, eliminar, acciones, notificaciones y actores. -->
					<dx-data-grid
						*ngIf="isPasoBrowse()"
						class="theme-dependent sguees-data-grid-mtto"
						[dataSource]="pasos"
						keyExpr="CORR_PASO"
						[columnAutoWidth]="false"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[allowColumnResizing]="true"
						[columnResizingMode]="'widget'"
						[width]="'100%'"
						noDataText="Sin pasos."
						(onRowDblClick)="rowDblClickPaso($event)"
					>
						<dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
						<dxo-pager [visible]="true" [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 25]" [showInfo]="true"></dxo-pager>
						<dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
						<dxo-scrolling [mode]="'standard'" [useNative]="false" [showScrollbar]="'always'"></dxo-scrolling>
						<dxo-load-panel [enabled]="false"></dxo-load-panel>
						<dxi-column caption="" [width]="180" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesPasoTpl" alignment="center"></dxi-column>
						<div *dxTemplate="let cell of 'accionesPasoTpl'">
							<dx-button *ngIf="permiteEdit" icon="edit" stylingMode="text" hint="Editar" (onClick)="editarPaso(cell.data)"></dx-button>
							<dx-button *ngIf="permiteDele" icon="trash" stylingMode="text" hint="Eliminar" (onClick)="pedirEliminarPaso(cell.data)"></dx-button>
							<dx-button icon="optionsgear" stylingMode="text" hint="Configuración de acciones del paso" (onClick)="abrirModalAcciones({ row: { data: cell.data } })"></dx-button>
							<dx-button icon="bell" stylingMode="text" hint="Agregar notificaciones" (onClick)="abrirModalNotificaciones({ row: { data: cell.data } })"></dx-button>
							<dx-button icon="accountbox" stylingMode="text" hint="Agregar actores" (onClick)="abrirModalActores({ row: { data: cell.data } })"></dx-button>
						</div>
						<dxi-column dataField="CORR_PASO" caption="Corr." [width]="100"></dxi-column>
						<dxi-column dataField="ORDEN" caption="Paso" [width]="100"></dxi-column>
						<dxi-column dataField="NOMBRE_PASO" caption="Nombre del paso" [width]="300" [minWidth]="180"></dxi-column>
						<dxi-column dataField="NOMBRE_ACTOR" caption="Actor origen" [width]="200" [minWidth]="160"></dxi-column>
						<dxi-column dataField="NOMBRE_ACTOR_DESTINO" caption="Actor destino" [width]="200" [minWidth]="160"></dxi-column>
						<dxi-column dataField="NOMBRE_ESTADO_ORIGEN" caption="Estado origen" [width]="150"></dxi-column>
						<dxi-column dataField="USUARIO_CREA" caption="Usuario Crea" [width]="150"></dxi-column>
						<dxi-column dataField="FECHA_CREA" caption="Fecha Crea" [width]="160" dataType="datetime" format="dd/MM/yyyy HH:mm"></dxi-column>
					</dx-data-grid>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</section>
</div>

<!-- Qué hace: listado de flujos. La barra de arriba es la del ribbon; esta grilla no arma otra. -->
<app-data-grid-mtto
    [isBrowse]="isBrowse()"
    [models]="models"
    [columns]="columns"
    [summary]="summary"
    [keyExpr]="'CORR_FLUJO_PROCESO'"
    [nativeToolbar]="true"
    [unifiedToolbar]="false"
    [showSearch]="false"
    [showExport]="false"
    [showAdd]="false"
    [showRefresh]="false"
    [permiteEditar]="getPermiteEditar"
    [permiteDele]="getPermiteDele"
    (rowDblClick)="rowDblClick($event)"
    (rowRemoving)="rowRemoving($event)"
    (focusedRowChanged)="focusedRowChanged($event)"
    (editClick)="editarClick($event)"
>
</app-data-grid-mtto>

 </div>
<!-- Modal: Acciones del Paso -->
<dx-popup
    [(visible)]="modalAccionesVisible"
    [wrapperAttr]="{ class: 'seg-flujo-paso-popup paso-acciones-popup' }"
    [title]="'Acciones del Paso: ' + (pasoSeleccionadoAcciones?.NOMBRE_PASO || '')"
    [showCloseButton]="true"
    [width]="'1360'"
    [maxWidth]="'96vw'"
    [height]="'auto'"
    [maxHeight]="'78vh'"
    [dragEnabled]="true"
    [resizeEnabled]="true"
    (onShown)="onFlujoPopupShown($event)"
    (onHidden)="cerrarModalAcciones()"
>
    <dxo-position at="center" my="center"></dxo-position>
    <div *dxTemplate="let data of 'content'">
        <div class="seg-flujo-modal-body">

            <div class="seg-flujo-modal-toolbar" *ngIf="(permiteAdd && isAccionEstadoBrowse()) || isAccionEstadoForm()">
                <dx-button
                    *ngIf="permiteAdd && isAccionEstadoBrowse()"
                    icon="plus"
                    text="Nuevo"
                    type="default"
                    stylingMode="contained"
                    (onClick)="nuevoAccionEstado()"
                ></dx-button>
                <dx-button
                    *ngIf="isAccionEstadoForm()"
                    icon="save"
                    text="Guardar"
                    type="success"
                    stylingMode="contained"
                    (onClick)="guardarAccionEstado()"
                ></dx-button>
                <dx-button
                    *ngIf="isAccionEstadoForm()"
                    icon="revert"
                    text="Cancelar"
                    type="danger"
                    stylingMode="contained"
                    (onClick)="cancelarAccionEstado()"
                ></dx-button>
            </div>

            <!-- Formulario Acción-Estado -->
            <div *ngIf="isAccionEstadoForm()" class="seg-flujo-modal-form">
                <dx-form
                    [formData]="accionEstadoModel"
                    [labelLocation]="'top'"
                    [colCount]="8"
                    [items]="itemsAccionEstado"
                    [readOnly]="accionEstadoReadOnly"
                >
                    <div *dxTemplate="let cellInfo of 'CORR_ESTADO_DESTINOLookup'">
                        <app-data-lookup
                            [model]="mCORR_ESTADO_ORIGEN"
                            [(value)]="accionEstadoModel.CORR_ESTADO_DESTINO"
                            [valueExpr]="'CORR_ESTADO'"
                            [displayExpr]="'NOMBRE_ESTADO'"
                            [selectedRowKeys]="selectedLookUpCORR_ESTADO_DESTINO"
                            [readOnly]="accionEstadoReadOnly"
                        >
                        </app-data-lookup>
                    </div>
                    <div *dxTemplate="let cellInfo of 'CORR_TIPO_MOVIMIENTOLookup'">
                        <app-data-lookup
                            [model]="mCORR_TIPO_MOVIMIENTO"
                            [(value)]="accionEstadoModel.CORR_TIPO_MOVIMIENTO"
                            [valueExpr]="'CORR_TIPO_MOVIMIENTO'"
                            [displayExpr]="'NOMBRE_TIPO'"
                            [selectedRowKeys]="selectedLookUpCORR_TIPO_MOVIMIENTO"
                            [readOnly]="accionEstadoReadOnly"
                        >
                        </app-data-lookup>
                    </div>
                    <div *dxTemplate="let cellInfo of 'CORR_TIPO_NOTIFICACIONLookup'">
                        <app-data-lookup
                            [model]="mCORR_TIPO_NOTIFICACION"
                            [(value)]="accionEstadoModel.CORR_TIPO_NOTIFICACION"
                            [valueExpr]="'CORR_TIPO_NOTIFICACION'"
                            [displayExpr]="'NOMBRE_TIPO'"
                            [selectedRowKeys]="selectedLookUpCORR_TIPO_NOTIFICACION"
                            [readOnly]="accionEstadoReadOnly"
                        >
                        </app-data-lookup>
                    </div>
                    <div *dxTemplate="let cellInfo of 'CORR_PASO_DESTINOLookup'">
                        <app-data-lookup
                            [model]="mCORR_PASO_DESTINO"
                            [(value)]="accionEstadoModel.CORR_PASO_DESTINO"
                            [valueExpr]="'CORR_PASO'"
                            [displayExpr]="'NOMBRE_PASO_DESTINO'"
                            [selectedRowKeys]="selectedLookUpCORR_PASO_DESTINO"
                            [readOnly]="accionEstadoReadOnly"
                        >
                        </app-data-lookup>
                    </div>
                </dx-form>
            </div>

            <!-- Grid Acción-Estado -->
            <div class="seg-flujo-modal-grid" *ngIf="isAccionEstadoBrowse()">
                <dx-data-grid
                    class="theme-dependent sguees-data-grid-mtto"
                    [dataSource]="accionesEstado"
                    keyExpr="CORR_ACCION"
                    [height]="'auto'"
                    [columnAutoWidth]="false"
                    [showBorders]="true"
                    [showColumnLines]="true"
                    [showRowLines]="true"
                    [rowAlternationEnabled]="true"
                    [hoverStateEnabled]="true"
                    [allowColumnResizing]="true"
                    [columnResizingMode]="'widget'"
                    [width]="'100%'"
                    noDataText="Sin acciones."
                    (onRowDblClick)="editarAccionEstado($event)"
                >
                    <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
                    <dxo-pager [visible]="true" [showInfo]="true"></dxo-pager>
                    <dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
                    <dxo-scrolling [mode]="'standard'" [showScrollbar]="'always'"></dxo-scrolling>
                    <dxo-load-panel [enabled]="false"></dxo-load-panel>
                    <dxi-column caption="" [width]="90" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesAccionTpl" alignment="center"></dxi-column>
                    <div *dxTemplate="let cell of 'accionesAccionTpl'">
                        <dx-button *ngIf="permiteEdit" icon="edit" stylingMode="text" hint="Editar" (onClick)="editarAccionEstado(cell.data)"></dx-button>
                        <dx-button *ngIf="permiteDele" icon="trash" stylingMode="text" hint="Eliminar" (onClick)="pedirEliminarAccionEstado(cell.data)"></dx-button>
                    </div>
                    <dxi-column dataField="CORR_ACCION" caption="Accion" [width]="100"></dxi-column>
                    <dxi-column dataField="NOMBRE_ESTADO" caption="Estado Destino" [width]="200" [minWidth]="160"></dxi-column>
                    <dxi-column dataField="TIPO_MOVIMIENTO" caption="Tipo Movimiento" [width]="250" [minWidth]="160"></dxi-column>
                    <dxi-column dataField="TIPO_NOTIFICACION" caption="Tipo Notificación" [width]="250" [minWidth]="160"></dxi-column>
                    <dxi-column dataField="CORR_PASO_DESTINO" caption="Paso Destino" [width]="200"></dxi-column>
                    <dxi-column dataField="PERMITIDO" caption="Permitido" [width]="120" alignment="center" cellTemplate="siNoAccionTpl"></dxi-column>
                    <div *dxTemplate="let cell of 'siNoAccionTpl'">{{ cell.value ? 'Sí' : 'No' }}</div>
                </dx-data-grid>
            </div>

        </div>
    </div>
</dx-popup>

<!-- Modal: Mensajes por Estado (Notificaciones) -->
<dx-popup
    [(visible)]="modalNotificacionesVisible"
    [wrapperAttr]="{ class: 'seg-flujo-paso-popup paso-notificaciones-popup' }"
    [title]="tituloModalNotificaciones"
    [showCloseButton]="true"
    [width]="'1360'"
    [maxWidth]="'96vw'"
    [height]="'auto'"
    [maxHeight]="'78vh'"
    [dragEnabled]="true"
    [resizeEnabled]="true"
    (onShown)="onFlujoPopupShown($event)"
    (onHidden)="cerrarModalNotificaciones()"
>
    <dxo-position at="center" my="center"></dxo-position>
    <div *dxTemplate="let data of 'content'">
        <div class="seg-flujo-modal-body">

            <div class="seg-flujo-modal-toolbar" *ngIf="(permiteAdd && isEstadoMensajeBrowse()) || isEstadoMensajeForm()">
                <dx-button
                    *ngIf="permiteAdd && isEstadoMensajeBrowse()"
                    icon="plus"
                    text="Nuevo"
                    type="default"
                    stylingMode="contained"
                    (onClick)="nuevoEstadoMensaje()"
                ></dx-button>
                <dx-button
                    *ngIf="isEstadoMensajeForm()"
                    icon="save"
                    text="Guardar"
                    type="success"
                    stylingMode="contained"
                    (onClick)="guardarEstadoMensaje()"
                ></dx-button>
                <dx-button
                    *ngIf="isEstadoMensajeForm()"
                    icon="revert"
                    text="Cancelar"
                    type="danger"
                    stylingMode="contained"
                    (onClick)="cancelarEstadoMensaje()"
                ></dx-button>
            </div>

            <!-- Formulario Estado-Mensaje -->
            <div *ngIf="isEstadoMensajeForm()" class="seg-flujo-modal-form">
                <dx-form
                    [formData]="estadoMensajeModel"
                    [labelLocation]="'top'"
                    [colCount]="8"
                    [items]="itemsEstadoMensaje"
                    [readOnly]="estadoMensajeReadOnly"
                >
                    <div *dxTemplate="let cellInfo of 'CORR_ESTADO_MENSAJELookup'">
                        <app-data-lookup
                            [model]="mCORR_ESTADO_ORIGEN"
                            [(value)]="estadoMensajeModel.CORR_ESTADO"
                            [valueExpr]="'CORR_ESTADO'"
                            [displayExpr]="'NOMBRE_ESTADO'"
                            [selectedRowKeys]="selectedLookUpCORR_ESTADO_MENSAJE"
                            [readOnly]="estadoMensajeReadOnly"
                        >
                        </app-data-lookup>
                    </div>
                    <div *dxTemplate="let cellInfo of 'CORR_ACTOR_MENSAJELookup'">
                        <app-data-lookup
                            [model]="mCORR_ACTOR_ORIGEN"
                            [(value)]="estadoMensajeModel.CORR_ACTOR"
                            [valueExpr]="'CORR_ACTOR'"
                            [displayExpr]="'NOMBRE_ACTOR'"
                            [selectedRowKeys]="selectedLookUpCORR_ACTOR_MENSAJE"
                            [readOnly]="estadoMensajeReadOnly"
                            [showClearButton]="true"
                        >
                        </app-data-lookup>
                    </div>
                </dx-form>
            </div>

            <!-- Grid Estado-Mensaje -->
            <div class="seg-flujo-modal-grid" *ngIf="isEstadoMensajeBrowse()">

                    class="theme-dependent sguees-data-grid-mtto"
                    [dataSource]="estadosMensaje"
                    keyExpr="CORR_ESTADO_MENSAJE"
                    [height]="'auto'"
                    [columnAutoWidth]="false"
                    [showBorders]="true"
                    [showColumnLines]="true"
                    [showRowLines]="true"
                    [rowAlternationEnabled]="true"
                    [hoverStateEnabled]="true"
                    [allowColumnResizing]="true"
                    [columnResizingMode]="'widget'"
                    [width]="'100%'"
                    noDataText="Sin mensajes."
                    (onRowDblClick)="editarEstadoMensaje($event)"
                >
                    <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
                    <dxo-pager [visible]="true" [showInfo]="true"></dxo-pager>
                    <dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
                    <dxo-scrolling [mode]="'standard'" [showScrollbar]="'always'"></dxo-scrolling>
                    <dxo-load-panel [enabled]="false"></dxo-load-panel>
                    <dxi-column caption="" [width]="90" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesMensajeTpl" alignment="center"></dxi-column>
                    <div *dxTemplate="let cell of 'accionesMensajeTpl'">
                        <dx-button *ngIf="permiteEdit" icon="edit" stylingMode="text" hint="Editar" (onClick)="editarEstadoMensaje(cell.data)"></dx-button>
                        <dx-button *ngIf="permiteDele" icon="trash" stylingMode="text" hint="Eliminar" (onClick)="pedirEliminarEstadoMensaje(cell.data)"></dx-button>
                    </div>
                    <dxi-column dataField="CORR_ESTADO_MENSAJE" caption="Corr." [width]="100"></dxi-column>
                    <dxi-column dataField="NOMBRE_ESTADO" caption="Estado" [width]="200" [minWidth]="140"></dxi-column>
                    <dxi-column dataField="NOMBRE_ACTOR" caption="Actor Destino" [width]="200" [minWidth]="140"></dxi-column>
                    <dxi-column dataField="LOGIN_SISTEMA" caption="Login Sistema" [width]="200"></dxi-column>
                    <dxi-column dataField="MENSAJE" caption="Mensaje" [width]="280" [minWidth]="180"></dxi-column>
                    <dxi-column dataField="ACTIVO" caption="Activo" [width]="100" alignment="center" cellTemplate="siNoMensajeTpl"></dxi-column>
                    <div *dxTemplate="let cell of 'siNoMensajeTpl'">{{ cell.value ? 'Sí' : 'No' }}</div>
                </dx-data-grid>
            </div>

        </div>
    </div>
</dx-popup>

<!-- Modal: Actores Destino del Paso -->
<dx-popup
    [(visible)]="modalActoresVisible"
    [wrapperAttr]="{ class: 'seg-flujo-paso-popup paso-actores-popup' }"
    [title]="'Actores Destino - Paso: ' + (pasoSeleccionadoActores?.NOMBRE_PASO || '')"
    [showCloseButton]="true"
    [width]="'1100'"
    [maxWidth]="'96vw'"
    [height]="'auto'"
    [maxHeight]="'78vh'"
    [dragEnabled]="true"
    [resizeEnabled]="true"
    (onShown)="onFlujoPopupShown($event)"
    (onHidden)="cerrarModalActores()"
>
    <dxo-position at="center" my="center"></dxo-position>
    <div *dxTemplate="let data of 'content'">
        <div class="seg-flujo-modal-body">

            <div class="seg-flujo-modal-toolbar" *ngIf="(permiteAdd && isActorDestinoBrowse()) || isActorDestinoForm()">
                <dx-button
                    *ngIf="permiteAdd && isActorDestinoBrowse()"
                    icon="plus"
                    text="Nuevo"
                    type="default"
                    stylingMode="contained"
                    (onClick)="nuevoActorDestino()"
                ></dx-button>
                <dx-button
                    *ngIf="isActorDestinoForm()"
                    icon="save"
                    text="Guardar"
                    type="success"
                    stylingMode="contained"
                    (onClick)="guardarActorDestino()"
                ></dx-button>
                <dx-button
                    *ngIf="isActorDestinoForm()"
                    icon="revert"
                    text="Cancelar"
                    type="danger"
                    stylingMode="contained"
                    (onClick)="cancelarActorDestino()"
                ></dx-button>
            </div>

            <!-- Formulario Actor Destino -->
            <div *ngIf="isActorDestinoForm()" class="seg-flujo-modal-form">
                <dx-form
                    [formData]="actorDestinoModel"
                    [labelLocation]="'top'"
                    [colCount]="8"
                    [items]="itemsActorDestino"
                    [readOnly]="actorDestinoReadOnly"
                >
                    <div *dxTemplate="let cellInfo of 'CORR_ACTOR_ACTOR_DESTINOLookup'">
                        <app-data-lookup
                            [model]="mCORR_ACTOR_DESTINO"
                            [(value)]="actorDestinoModel.CORR_ACTOR"
                            [valueExpr]="'CORR_ACTOR'"
                            [displayExpr]="'NOMBRE_ACTOR'"
                            [selectedRowKeys]="selectedLookUpCORR_ACTOR_ACTOR_DESTINO"
                            [readOnly]="actorDestinoReadOnly"
                            (valueChange)="onActorDestinoModalChanged($event)"
                        >
                        </app-data-lookup>
                    </div>
                    <div *dxTemplate="let cellInfo of 'CORR_UNIDAD_ACTOR_DESTINOTemplate'">
                        <div *ngIf="mostrarUnidadActorModal; else unidadActorHint">
                            <dx-select-box
                                [dataSource]="unidadesPaso"
                                [(value)]="actorDestinoModel.CORR_UNIDAD"
                                displayExpr="NOMBRE_UNIDAD_TREE"
                                valueExpr="CORR_UNIDAD"
                                placeholder="Seleccionar unidad destino..."
                                [showClearButton]="true"
                                [searchEnabled]="true"
                                [searchTimeout]="200"
                            >
                            </dx-select-box>
                        </div>
                        <ng-template #unidadActorHint>
                            <span class="flujo-unidad-hint">
                                El actor seleccionado no requiere de unidad
                            </span>
                        </ng-template>
                    </div>
                </dx-form>
            </div>

            <!-- Grid Actor Destino -->
            <div class="seg-flujo-modal-grid" *ngIf="isActorDestinoBrowse()">
                <dx-data-grid
                    class="theme-dependent sguees-data-grid-mtto"
                    [dataSource]="actoresDestino"
                    keyExpr="CORR_PASO_ACTOR_DESTINO"
                    [height]="'auto'"
                    [columnAutoWidth]="false"
                    [showBorders]="true"
                    [showColumnLines]="true"
                    [showRowLines]="true"
                    [rowAlternationEnabled]="true"
                    [hoverStateEnabled]="true"
                    [allowColumnResizing]="true"
                    [columnResizingMode]="'widget'"
                    [width]="'100%'"
                    noDataText="Sin actores destino."
                    (onRowDblClick)="editarActorDestino($event)"
                >
                    <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
                    <dxo-pager [visible]="true" [showInfo]="true"></dxo-pager>
                    <dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
                    <dxo-scrolling [mode]="'standard'" [showScrollbar]="'always'"></dxo-scrolling>
                    <dxo-load-panel [enabled]="false"></dxo-load-panel>
                    <dxi-column caption="" [width]="90" [allowFiltering]="false" [allowSorting]="false" cellTemplate="accionesActorTpl" alignment="center"></dxi-column>
                    <div *dxTemplate="let cell of 'accionesActorTpl'">
                        <dx-button *ngIf="permiteEdit" icon="edit" stylingMode="text" hint="Editar" (onClick)="editarActorDestino(cell.data)"></dx-button>
                        <dx-button *ngIf="permiteDele" icon="trash" stylingMode="text" hint="Eliminar" (onClick)="pedirEliminarActorDestino(cell.data)"></dx-button>
                    </div>
                    <dxi-column dataField="CORR_PASO_ACTOR_DESTINO" caption="Corr." [width]="100"></dxi-column>
                    <dxi-column dataField="NOMBRE_ACTOR" caption="Actor Destino" [width]="280" [minWidth]="180"></dxi-column>
                    <dxi-column dataField="NOMBRE_UNIDAD" caption="Unidad" [width]="280" [minWidth]="180"></dxi-column>
                    <dxi-column dataField="ACTIVO" caption="Activo" [width]="100" alignment="center" cellTemplate="siNoActorTpl"></dxi-column>
                    <div *dxTemplate="let cell of 'siNoActorTpl'">{{ cell.value ? 'Sí' : 'No' }}</div>
                </dx-data-grid>
            </div>

        </div>
    </div>
</dx-popup>

<dx-load-panel
    #loadPanel
    shadingColor="rgba(0,0,0,0.4)"
    [position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
    [(visible)]="loadingVisible"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
>
</dx-load-panel>
