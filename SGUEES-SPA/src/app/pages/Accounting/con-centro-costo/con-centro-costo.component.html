<div class="sguees-mtto-view">

<app-barra-data-mtto

	[tituloVentana]="tituloVentana"

	[subTituloVentana]="subTituloVentana"

	[isBrowse]="isBrowse()"

	[isForm]="isForm()"

	[permiteAdd]="permiteAdd"

	(nuevo)="nuevo()"

	(guardar)="guardar()"

	(cancelar)="cancelar()"

>

</app-barra-data-mtto>



<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">

	<dx-form

		#fData

		id="fData"

		[formData]="model"

		[labelLocation]="'top'"

		[colCount]="mttoFormColCount"

		[colCountByScreen]="mttoFormColCountByScreen"

		[showRequiredMark]="false"

		[items]="items"

	>

		<div *dxTemplate="let cellInfo of 'CORR_TIPO_CENTRO_COSTOLookup'">

			<app-data-lookup

				[model]="mCORR_TIPO_CENTRO_COSTO"

				[(value)]="model.CORR_TIPO_CENTRO_COSTO"

				[selectedRowKeys]="selectedLookUpCORR_TIPO_CENTRO_COSTO"

				[readOnly]="readOnly"

				[valueExpr]="'CORR_TIPO_CENTRO_COSTO'"

				[displayExpr]="'NOMBRE_TIPO_CENTRO_COSTO'"

				[lookupColumns]="tipoCentroCostoLookupColumns"

			>

			</app-data-lookup>

		</div>

		<div *dxTemplate="let cellInfo of 'ESTADO_CENTRO_COSTOLookup'">

			<app-data-lookup

				[model]="mESTADO_CENTRO_COSTO"

				[(value)]="model.ESTADO_CENTRO_COSTO"

				[selectedRowKeys]="selectedLookUpLista"

				[readOnly]="readOnly"

			>

			</app-data-lookup>

		</div>

		<div *dxTemplate="let cellInfo of 'CORR_UNIDAD_NEGOCIOLookup'">

			<app-data-lookup

				[model]="mCORR_UNIDAD_NEGOCIO"

				[(value)]="model.CORR_UNIDAD_NEGOCIO"

				[selectedRowKeys]="selectedLookUpCORR_UNIDAD_NEGOCIO"

				[readOnly]="readOnly"

				[valueExpr]="'CORR_UNIDAD_NEGOCIO'"

				[displayExpr]="'NOMBRE_UNIDAD_NEGOCIO'"

				[lookupColumns]="unidadNegocioLookupColumns"

			>

			</app-data-lookup>

		</div>

		<div *dxTemplate="let cellInfo of 'CORR_AREA_FUNCIONALLookup'">

			<app-data-lookup

				[model]="mCORR_AREA_FUNCIONAL"

				[(value)]="model.CORR_AREA_FUNCIONAL"

				[selectedRowKeys]="selectedLookUpCORR_AREA_FUNCIONAL"

				[readOnly]="readOnly"

				[valueExpr]="'CORR_AREA_FUNCIONAL'"

				[displayExpr]="'NOMBRE_AREA_FUNCIONAL'"

				[lookupColumns]="areaFuncionalLookupColumns"

			>

			</app-data-lookup>

		</div>

	</dx-form>

	<dx-tab-panel #tabPanel [selectedIndex]="0">

		<dxi-item title="Presupuesto" [icon]="'money'">

			<div class="dx-grid-deta">

				<dx-data-grid

					#gridPresupuesto

					[dataSource]="presupuestos"

					keyExpr="['ANIO_PERIODO','MES_PERIODO']"

					[columnAutoWidth]="false"

					[showBorders]="true"

					[showColumnLines]="true"

					[showRowLines]="true"

					[rowAlternationEnabled]="true"

					[hoverStateEnabled]="true"

					[allowColumnResizing]="true"

					[focusedRowEnabled]="true"

					[height]="'100%'"

					[width]="'100%'"

					(onRowInserting)="presupuestoRowInserting($event)"

					(onRowUpdated)="presupuestoRowUpdated($event)"

					(onRowRemoving)="presupuestoRowRemoving($event)"

				>

					<dxo-toolbar>

						<dxi-item location="before">

							<div *dxTemplate>

								<dx-button

									icon="add"

									text="Agregar Presupuesto"

									type="success"

									(onClick)="agregarPresupuesto()"

									[visible]="!readOnly"

									[width]="200"

								></dx-button>

							</div>

						</dxi-item>

					</dxo-toolbar>

					<dxo-editing

						[mode]="'cell'"

						[refreshMode]="'reshape'"

						[allowUpdating]="!readOnly"

						[allowDeleting]="!readOnly"

						[useIcons]="true"

					></dxo-editing>

					<dxo-paging [enabled]="false"></dxo-paging>

					<dxi-column type="buttons" [width]="45">

						<dxi-button name="delete" [visible]="!readOnly"></dxi-button>

					</dxi-column>

					<dxi-column dataField="ANIO_PERIODO" caption="Año" [width]="100" dataType="number"></dxi-column>

					<dxi-column dataField="MES_PERIODO" caption="Mes" [width]="100" dataType="number"></dxi-column>

					<dxi-column dataField="MONTO_PRESUPUESTO" caption="Monto" [width]="180" dataType="number" [format]="'#,##0.00'" [editorOptions]="{ format: '#,##0.00' }"></dxi-column>

					<dxo-summary>

						<dxi-total-item column="ANIO_PERIODO" summaryType="count" valueFormat="#,##0" displayFormat="Cant: {0}"></dxi-total-item>

						<dxi-total-item column="MONTO_PRESUPUESTO" summaryType="sum" valueFormat="#,##0.00" displayFormat="Total: {0}"></dxi-total-item>

					</dxo-summary>

				</dx-data-grid>

			</div>

		</dxi-item>

	</dx-tab-panel>

</div>



<app-data-grid-mtto

	[isBrowse]="isBrowse()"

	[models]="models"

	[columns]="columns"

	[summary]="summary"

	[keyExpr]="mttoGridKeyExpr"

	[pageSize]="mttoPageSize"

	[allowedPageSizes]="mttoPageSizes"

	[remoteOperations]="mttoRemoteOperations"

	[showSearch]="false"

	[showAdd]="true"

	[showRefresh]="true"

	[showExport]="true"

	[focusedRowKey]="gridFocusedRowKey"

	[permitePrint]="permitePrint"

	[permiteEditar]="getPermiteEditar"

	[permiteDele]="getPermiteDele"

	[responsiveColumnHiding]="false"

	[columnHidingEnabled]="false"

	[exportFileName]="'CentrosCosto'"

	(refresh)="consultar()"

	(add)="nuevo()"

	(rowDblClick)="rowDblClick($event)"

	(rowRemoving)="rowRemoving($event)"

	(focusedRowChanged)="focusedRowChanged($event)"

	(editClick)="editarClick($event)"

>

</app-data-grid-mtto>



</div>



<dx-load-panel

	#loadPanel

	shadingColor="rgba(0,0,0,0.4)"

	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"

	[(visible)]="loadingVisible"

	[showIndicator]="true"

	[showPane]="true"

	[shading]="true"

	(onShown)="(loadingVisible)"

>

</dx-load-panel>
