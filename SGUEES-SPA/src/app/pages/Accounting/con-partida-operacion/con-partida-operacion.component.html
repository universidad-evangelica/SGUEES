<h2 class="content-block">{{ tituloVentana }}</h2>

<div class="view-wrapper list-page content-block dx-card responsive-paddings filtros-card" *ngIf="isBrowse()">
	<div class="filtros">
		<div class="filtro">
			<div class="filtro-label">Fecha Inicial</div>
			<dx-date-box
				class="filtro-control"
				[(value)]="vFECHA_INICIAL"
				[useMaskBehavior]="true"
				type="date"
				displayFormat="dd/MM/yyyy"
				[width]="220"
				[height]="44"
			></dx-date-box>
		</div>
		<div class="filtro">
			<div class="filtro-label">Fecha Final</div>
			<dx-date-box
				class="filtro-control"
				[(value)]="vFECHA_FINAL"
				[useMaskBehavior]="true"
				type="date"
				displayFormat="dd/MM/yyyy"
				[width]="220"
				[height]="44"
			></dx-date-box>
		</div>
		<div class="filtro-acciones">
			<dx-button
				class="filtro-btn"
				text="Consultar"
				type="default"
				icon="search"
				[width]="150"
				[height]="44"
				(onClick)="consultar()"
			></dx-button>
			<dx-button
				*ngIf="btnImprimir"
				class="filtro-btn"
				[text]="btnImprimir"
				type="default"
				icon="print"
				stylingMode="outlined"
				[width]="150"
				[height]="44"
				(onClick)="imprimirPartida()"
			></dx-button>
			<dx-button
				class="filtro-btn"
				[text]="getAccionLabel()"
				type="success"
				icon="check"
				[width]="150"
				[height]="44"
				(onClick)="ejecutarOperacion()"
			></dx-button>
		</div>
	</div>
</div>

<div class="view-wrapper list-page content-block" *ngIf="isBrowse()">
	<dx-data-grid
		#gridPartidas
		[dataSource]="models"
		[showBorders]="true"
		[showColumnLines]="true"
		[showRowLines]="true"
		[rowAlternationEnabled]="true"
		[hoverStateEnabled]="true"
		[allowColumnResizing]="true"
		[columnResizingMode]="'widget'"
		[wordWrapEnabled]="false"
		[focusedRowEnabled]="true"
		[autoNavigateToFocusedRow]="true"
		[height]="560"
		[width]="'100%'"
		[keyExpr]="['ANIO_PERIODO', 'MES_PERIODO', 'CORR_CLASE_PARTIDA', 'CORR_PARTIDA']"
		(onRowDblClick)="rowDblClick($event)"
		(onFocusedRowChanged)="focusedRowChanged($event)"
	>
		<dxo-toolbar>
			<dxi-item location="before">
				<div *dxTemplate>
					<dx-button icon="selectall" text="Todos" type="success" stylingMode="outlined" (onClick)="selectTodos()" width="150"></dx-button>
				</div>
			</dxi-item>
			<dxi-item location="before">
				<div *dxTemplate>
					<dx-button text="Ninguno" icon="unselectall" type="danger" stylingMode="outlined" (onClick)="selectNinguno()" width="150"></dx-button>
				</div>
			</dxi-item>
		</dxo-toolbar>
		<dxo-editing mode="cell" [allowUpdating]="true" startEditAction="click" [useIcons]="true"></dxo-editing>
		<dxo-search-panel [visible]="true" [width]="240"></dxo-search-panel>
		<dxo-filter-row [visible]="true" [applyFilter]="'auto'"></dxo-filter-row>
		<dxo-scrolling mode="virtual" useNative="true"></dxo-scrolling>
		<dxo-paging [enabled]="false"></dxo-paging>
		<dxo-column-fixing [enabled]="true"></dxo-column-fixing>

		<dxi-column
			type="buttons"
			caption="Impr."
			[width]="70"
			[fixed]="true"
			fixedPosition="left"
			[visibleIndex]="0"
			[allowResizing]="false"
			[allowEditing]="false"
		>
			<dxi-button
				hint="Imprimir partida"
				icon="print"
				[visible]="gridPrintButtonVisible"
				[onClick]="imprimirPartidaDesdeFila"
			></dxi-button>
		</dxi-column>
		<dxi-column
			dataField="SELECCION"
			caption="Sel."
			[dataType]="'boolean'"
			[width]="70"
			[fixed]="true"
			fixedPosition="left"
			[visibleIndex]="1"
			[allowEditing]="true"
		></dxi-column>
		<dxi-column dataField="ANIO_PERIODO" caption="Año" [width]="80" alignment="center" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="MES_PERIODO" caption="Mes" [width]="80" alignment="center" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="NOMBRE_CORTO_CLASE" caption="Clase" [width]="120" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="CORR_PARTIDA" caption="No. Partida" [width]="130" alignment="center" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="FECHA_PARTIDA" caption="Fecha" [dataType]="'date'" format="dd/MM/yyyy" [width]="120" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="NUMERO_DOCUMENTO" caption="No. Documento" [width]="180" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="NOMBRE_PARTIDA" caption="Concepto" [minWidth]="300" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="NOMBRE_ESTADO_PARTIDA" caption="Estado" [width]="140" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="MONTO_CARGO" caption="Cargo" [width]="140" [format]="'#,##0.00'" alignment="right" [allowEditing]="false"></dxi-column>
		<dxi-column dataField="MONTO_ABONO" caption="Abono" [width]="140" [format]="'#,##0.00'" alignment="right" [allowEditing]="false"></dxi-column>

		<dxo-summary>
			<dxi-total-item column="CORR_PARTIDA" summaryType="count" valueFormat="#,##0" displayFormat="Cant: {0}"></dxi-total-item>
			<dxi-total-item column="MONTO_CARGO" summaryType="sum" valueFormat="#,##0.00" displayFormat="{0}"></dxi-total-item>
			<dxi-total-item column="MONTO_ABONO" summaryType="sum" valueFormat="#,##0.00" displayFormat="{0}"></dxi-total-item>
		</dxo-summary>
	</dx-data-grid>
	<div *ngIf="!loadingVisible && (!models || models.length === 0)" class="sin-registros-msg">
		{{ sinRegistrosMsg }}
	</div>
</div>

<div *ngIf="!isBrowse()" class="partida-edit-shell content-block">
	<div class="partida-consulta-toolbar">
		<dx-button text="Volver" icon="back" type="default" stylingMode="outlined" (onClick)="volverAlListado()"></dx-button>
		<dx-button
			*ngIf="permitePrint"
			text="Imprimir"
			icon="print"
			type="default"
			stylingMode="outlined"
			(onClick)="imprimirPartidaConsulta()"
		></dx-button>
	</div>

	<section class="sguees-section-card partida-form-card dx-card responsive-paddings">
		<header class="partida-section-head">
			<span class="partida-section-title">Datos de la partida</span>
			<span class="partida-section-subtitle">Consulta de encabezado contable</span>
		</header>
		<dx-form
			class="sguees-form-premium partida-form"
			[formData]="partidaConsulta"
			[items]="partidaViewItems"
			[labelLocation]="'top'"
			[colCount]="8"
			[colCountByScreen]="partidaViewColCountByScreen"
		></dx-form>
	</section>

	<section class="sguees-section-card partida-detalle-card dx-card responsive-paddings">
		<dx-tab-panel class="partida-tab-panel" [selectedIndex]="0" [height]="'100%'">
			<dxi-item title="Detalle Partida" icon="detailslayout">
				<div class="partida-consulta-grid dx-grid-deta partida-deta-grid">
					<dx-data-grid
						class="partida-deta-datagrid"
						[dataSource]="detallesConsulta"
						[columns]="detalleColumns"
						keyExpr="CORR_PARTIDA_DETA"
						[columnAutoWidth]="false"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[allowColumnResizing]="true"
						[columnResizingMode]="'widget'"
						[height]="480"
						[width]="'100%'"
					>
						<dxo-search-panel [visible]="true"></dxo-search-panel>
						<dxo-paging [enabled]="false"></dxo-paging>
						<dxo-scrolling mode="standard" [useNative]="true"></dxo-scrolling>
						<dxo-column-fixing [enabled]="true"></dxo-column-fixing>
						<dxo-summary>
							<dxi-total-item column="CORR_PARTIDA_DETA" summaryType="count" valueFormat="#,##0" displayFormat="Cant: {0}"></dxi-total-item>
							<dxi-total-item column="MONTO_CARGO" summaryType="sum" valueFormat="#,##0.00" displayFormat="{0}"></dxi-total-item>
							<dxi-total-item column="MONTO_ABONO" summaryType="sum" valueFormat="#,##0.00" displayFormat="{0}"></dxi-total-item>
						</dxo-summary>
					</dx-data-grid>
				</div>
			</dxi-item>
			<dxi-item title="Documentos Contables" icon="doc">
				<div class="partida-consulta-grid dx-grid-deta partida-deta-grid">
					<dx-data-grid
						class="partida-deta-datagrid"
						[dataSource]="documentosConsulta"
						[columns]="docColumns"
						[keyExpr]="['CORR_PARTIDA_DETA', 'ID_DOCUMENTO', 'FORMA']"
						[columnAutoWidth]="false"
						[showBorders]="true"
						[showColumnLines]="true"
						[showRowLines]="true"
						[rowAlternationEnabled]="true"
						[hoverStateEnabled]="true"
						[allowColumnResizing]="true"
						[columnResizingMode]="'widget'"
						[height]="480"
						[width]="'100%'"
					>
						<dxo-search-panel [visible]="true"></dxo-search-panel>
						<dxo-paging [enabled]="false"></dxo-paging>
						<dxo-scrolling mode="standard"></dxo-scrolling>
						<dxo-summary>
							<dxi-total-item column="CORR_PARTIDA_DETA" summaryType="count" valueFormat="#,##0" displayFormat="Cant: {0}"></dxi-total-item>
						</dxo-summary>
					</dx-data-grid>
				</div>
			</dxi-item>
		</dx-tab-panel>
	</section>
</div>

<dx-popup
	[(visible)]="popupVisiblePdf"
	[title]="'Partida Contable'"
	[fullScreen]="true"
	[showCloseButton]="true"
>
	<div *dxTemplate="let data of 'content'" style="height: 100%;">
		<object [data]="PDF" type="application/pdf" width="100%" height="95%">
			<embed [src]="PDF" type="application/pdf" />
		</object>
	</div>
</dx-popup>

<dx-load-panel
	shadingColor="rgba(0,0,0,0.4)"
	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"
	[(visible)]="loadingVisible"
	[showIndicator]="true"
	[showPane]="true"
	[shading]="true"
></dx-load-panel>
