<div class="sguees-mtto-view">

<app-barra-data-mtto

	[tituloVentana]="tituloVentana"


	[isBrowse]="isBrowse()"

	[isForm]="isForm()"

	[showRibbon]="true"
	[permiteAdd]="permiteAdd"
	[showRefresh]="true"
	[showExport]="permitePrint"
	(nuevo)="nuevo()"
	(guardar)="guardar()"
	(cancelar)="cancelar()"
	(consultar)="consultar()"

>

</app-barra-data-mtto>



<div class="content-block dx-card responsive-paddings sguees-mtto-form-card" *ngIf="!isBrowse()">

	<dx-form

		#fData

		id="fData"

		[formData]="model"

		[labelLocation]="'top'"

		[colCount]="mttoFormColCount"

		[colCountByScreen]="mttoFormColCountByScreen"

		[showRequiredMark]="false"

		[items]="items"

	>

		<div *dxTemplate="let cellInfo of 'RUBROLookup'">

			<app-data-lookup

				[model]="mCODIGO_RUBRO"

				[(value)]="model.CODIGO_RUBRO"

				[selectedRowKeys]="selectedLookUpCODIGO_RUBRO"

				[readOnly]="readOnly"

				[valueExpr]="'CODIGO_RUBRO'"

				[displayExpr]="'NOMBRE_RUBRO'"

				[lookupColumns]="rubroLookupColumns"

				(valueChange)="onRubroChanged($event)"

			>

			</app-data-lookup>

		</div>

		<div *dxTemplate="let cellInfo of 'CLASE_RUBROLookup'">

			<app-data-lookup

				[model]="mCLASE_RUBRO"

				[(value)]="model.CLASE_RUBRO"

				[selectedRowKeys]="selectedLookUpLista"

				[readOnly]="readOnly"

			>

			</app-data-lookup>

		</div>

		<div *dxTemplate="let cellInfo of 'CLASE_VALUACIONLookup'">

			<app-data-lookup

				[model]="mCLASE_VALUACION"

				[(value)]="model.CLASE_VALUACION"

				[selectedRowKeys]="selectedLookUpLista"

				[readOnly]="readOnly"

			>

			</app-data-lookup>

		</div>

	</dx-form>

</div>



<app-data-grid-mtto

	[isBrowse]="isBrowse()"

	[models]="models"

	[columns]="columns"

	[summary]="summary"

	[keyExpr]="mttoGridKeyExpr"

	[pageSize]="mttoPageSize"

	[allowedPageSizes]="mttoPageSizes"

	[remoteOperations]="mttoRemoteOperations"

	[showSearch]="false"
	[nativeToolbar]="true"
	[unifiedToolbar]="false"
	[showAdd]="false"
	[showRefresh]="false"
	[showExport]="false"

	[focusedRowKey]="gridFocusedRowKey"

	[permitePrint]="permitePrint"

	[permiteEditar]="getPermiteEditar"

	[permiteDele]="getPermiteDele"

	[responsiveColumnHiding]="false"

	[columnHidingEnabled]="false"

	[exportFileName]="'CatalogoCuentas'"
	(rowDblClick)="rowDblClick($event)"

	(rowRemoving)="rowRemoving($event)"

	(focusedRowChanged)="focusedRowChanged($event)"

	(editClick)="editarClick($event)"

>

</app-data-grid-mtto>



</div>



<dx-load-panel

	#loadPanel

	shadingColor="rgba(0,0,0,0.4)"

	[position]="{ my: 'center', at: 'center', of: '#LoadPanel' }"

	[(visible)]="loadingVisible"

	[showIndicator]="true"

	[showPane]="true"

	[shading]="true"

	(onShown)="(loadingVisible)"

>

</dx-load-panel>
